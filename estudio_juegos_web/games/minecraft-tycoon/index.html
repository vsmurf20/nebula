.panel{background:var(--panel);border:4px solid var(--line);box-shadow:inset 4px 4px 0 var(--hi),inset -4px -4px 0 #1f1913;padding:14px}

.sub{color:var(--mut)}

.btn:focus-visible{outline:3px solid var(--warn)}
.btn.on{background:var(--em);color:#06240f}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;margin-top:6px}
.row{display:flex;justify-content:space-between;gap:8px}
.inv{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;max-height:110px;overflow:auto}
.chip{background:var(--p2);border:2px solid var(--line);padding:1px 7px;display:flex;gap:6px;align-items:center;font-size:18px}

.item{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center;width:100%;background:var(--p2);border:3px solid var(--line);padding:7px 10px;margin-bottom:7px}
.item:focus-visible{outline:3px solid var(--warn)}
.item .ic{font-size:24px;text-align:center}
.item .t{font:10px/1.5 'Press Start 2P',monospace}
.item .d{color:var(--mut);font-size:18px}
.item .c{font:10px 'Press Start 2P',monospace;color:var(--em);text-align:right}
.item.off{opacity:.5;cursor:not-allowed}.item.off .c{color:#e26a5a}
.item:not(.off):hover{background:#463a2f}
.item.max{border-color:var(--warn)}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:7px}
.a{background:var(--p2);border:3px solid var(--line);padding:6px 8px;opacity:.45;font-size:18px}
.a.got{opacity:1;border-color:var(--warn)}
.a b{display:block;font:9px/1.5 'Press Start 2P',monospace;font-weight:400}
.bonus{position:fixed;z-index:60;font-size:44px;cursor:pointer;all:unset;position:fixed;animation:bob 1s infinite alternate;filter:drop-shadow(0 0 10px #ffd84a);font-size:44px;z-index:60}

.toast.on{transform:translate(-50%,0)}
.fr{color:var(--warn);font:10px 'Press Start 2P',monospace;min-height:14px}
@media(prefers-reduced-motion:reduce){.shake,#block.hit #cv,.pop,.bonus{animation:none}}
.peter{all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;margin:8px 0;width:100%}.peter:focus-visible{outline:3px solid var(--warn)}.peter>span:first-child{font-size:36px}.bubble{background:var(--p2);border:3px solid var(--line);padding:4px 8px;font-size:18px;min-height:34px;flex:1}.round .panel,.round .item,.round .btn,.round .a,.round .bubble,.round #cv{border-radius:12px}

.panel{background-image:linear-gradient(#ffffff05 50%,#0000 50%);background-size:100% 4px}h1{text-shadow:3px 3px 0 #000;color:#fff}
.stage{border:4px solid var(--line);box-shadow:inset 0 0 50px #000a;overflow:hidden;margin:8px 0;padding:18px 0 14px;text-shadow:1px 1px 0 #000;color:#fff}
.stage::before{content:'';position:absolute;inset:-100% 0 0;pointer-events:none;opacity:.7;background-image:radial-gradient(2px 2px at 20% 30%,var(--mc,#fff),#0000),radial-gradient(2px 2px at 65% 55%,var(--mc,#fff),#0000),radial-gradient(3px 3px at 85% 20%,var(--mc,#fff),#0000),radial-gradient(2px 2px at 40% 80%,var(--mc,#fff),#0000);background-size:220px 220px;animation:drift 14s linear infinite}

.item .ic{background:#0004;border:2px solid #0008;box-shadow:inset 2px 2px 0 #0006,inset -2px -2px 0 #fff2;height:38px;display:grid;place-items:center}
.bar i{box-shadow:inset 0 3px 0 #fff4,inset 0 -3px 0 #0003}.btn:active,.item:active{transform:translateY(2px)}
.spr{height:40px;width:30px;image-rendering:pixelated;display:block}.track .pp{display:block}
.ch{padding:4px 8px;border-left:4px solid var(--line);margin-bottom:3px;background:var(--p2);font-size:18px}.ch.done{border-color:var(--em)}.ch.cur{border-color:var(--warn);background:#0003}.ch.lk{opacity:.4}

@media(prefers-reduced-motion:reduce){#block,.stage::before{animation:none}}
.pets{display:flex;gap:8px;flex-wrap:wrap;font-size:26px}.pt{display:inline-block;animation:walk .7s infinite alternate}@media(prefers-reduced-motion:reduce){.pt{animation:none}}
.hot{display:flex;gap:5px;margin-top:2px}.slot{width:40px;height:40px;background:#0007;border:3px solid var(--line);display:grid;place-items:center;font-size:20px;position:relative;transition:transform .15s;text-shadow:none}.slot.on{transform:translateY(-6px);box-shadow:0 6px 12px #000a,0 0 10px #e8b64a88}.slot small{position:absolute;right:1px;bottom:-3px;font:8px 'Press Start 2P',monospace;color:#fff}
</style>
</head>

function nbk(){var p=[],tw=0;BL.forEach(function(b,i){if(b[0]===S.dim&&okb(i)){p.push(i);tw+=b[4]}});if(!p.length){p=[0,1];tw=BL[0][4]+BL[1][4]}var r=Math.random()*tw;for(var j=0;j<p.length;j++){r-=BL[p[j]][4];if(r<=0)return p[j]}return p[0]}
function vis(i){var r=[];for(var k=1;k<=6;k++){var key=i+':'+k;if(k<=S.tb[i]+1&&can(tcost(i,k)))S.ud[key]=1;if(S.ud[key]||k<=S.tb[i])r.push(k)}return r}
function hud(){if(!hotEl)return;if(cur!==S.bi){cur=S.bi;hits=0}var t=toolFor(S.bi),b=BL[S.bi];
 hotEl.forEach(function(e,i){e.className='slot'+(i===t?' on':'');e.style.borderColor=i===t?'#e8b64a':TC[S.tl[i]];e.querySelector('small').textContent=S.tl[i]?S.td[i]:'';e.style.display=S.tl[i]?'':'none'});
 var nm=S.tl[t]?TL[t][0]+' '+TN[S.tl[t]]+' ('+S.td[t]+'/'+DUR[S.tl[t]]+')':'Mano';
 $('hn').textContent=!okb(S.bi)?'⛔ '+nmsg(S.bi):nm+' · golpe '+(hits+1)+'/'+need();
 TL.forEach(function(x,i){var v=vis(i);tlEl[i].parentNode.style.display=v.length?'':'none';if(!v.length)return;if(v.indexOf(S.cs[i])<0)S.cs[i]=v[v.length-1];var k=S.cs[i],c=tcost(i,k),lock=k>S.tb[i]+1;
  tbEl[i].forEach(function(e,j){e.style.display=v.indexOf(j+1)<0?'none':'';e.classList.toggle('on',j+1===k);e.classList.toggle('lock',j+1>S.tb[i]+1)});
  upd(tlEl[i],x[0]+' de '+TN[k],(S.tl[i]?'Llevas '+TN[S.tl[i]]+' ('+S.td[i]+'/'+DUR[S.tl[i]]+')':'No tienes')+' · '+x[2]+' · x'+SP[k]+' · dur. '+DUR[k],lock?'🔒':cstr(c),lock||!can(c)||S.tl[i]>k);
  tlEl[i].classList.toggle('max',S.tl[i]===k)})}
/* bucle */
$('snd').onclick=function(){S.mute=S.mute?0:1;$('snd').textContent=S.mute?'🔇':'🔊'};$('snd').textContent=S.mute?'🔇':'🔊';
var rt,ra=0;$('reset').onclick=function(){if(!ra){ra=1;$('reset').textContent='¿Seguro?';rt=setTimeout(function(){ra=0;$('reset').textContent='Reiniciar'},3000)}else{bak('antes de reiniciar');S=def();fix();S.bi=0;save();applyTh();applySet();renderSt();draw();render();checkAch();ra=0;$('reset').textContent='Reiniciar'}};
var last=Date.now(),sv=0;
if(S.t){var off=Math.min((last-S.t)/1000,7200);if(off>30&&cps()>0){var g=cps()*off*.5*(ci(5)?2:1);S.e+=g;S.earned+=g;setTimeout(function(){toast('Mientras no estabas: +'+fmt(g))},600)}}
setInterval(function(){var n=Date.now(),dt=(n-last)/1000;last=n;var c=cps();if(fz>0)fz-=dt;if(lk>0)lk-=dt;if(pet(6)){ab+=dt;if(ab>1.5){ab=0;auto()}}if(c>0){S.e+=c*dt;S.earned+=c*dt}
 if(n-lastC>1100)combo=Math.max(0,combo-dt*(pet(2)?30:60));
 var cm=Math.min(combo,100);$('cb').style.width=cm+'%';$('cb').style.background=cm>=100?'#e8b64a':'#3fe07a';$('ct').textContent=combo>2?'COMBO x'+cmult().toFixed(1):'';
 $('glow').style.setProperty('--o',Math.min(1,cm/60));$('fr').textContent=fz>0?'🔥 FRENESÍ x7: '+Math.ceil(fz)+'s':'';
 render();sv+=dt;if(sv>4){sv=0;checkAch();save()}},100);
window.addEventListener('beforeunload',save);
S.bi=S.bi<BL.length?S.bi:0;applyTh();applySet();renderSt();say(S.st<ST.length?ST[S.st][1]:'¡Tenemos el huevo!');draw();render();checkAch();
})();
