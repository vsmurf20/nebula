<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Distrito Cero · v50</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9edf3;--fg:#141922;--pn:#fffffff2;--ac:#c98a00;--bd:#0003;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1118;--fg:#eef1f6;--pn:#161c28f2;--ac:#ffcc33;--bd:#fff3;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0e1118;--fg:#eef1f6;--pn:#161c28f2;--ac:#ffcc33;--bd:#fff3;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif}
#c{position:fixed;inset:0;display:block;image-rendering:pixelated}
#mm{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));border:1px solid rgba(255,255,255,.25);border-radius:18px;background:#000a;box-shadow:0 8px 24px #0008}
#worldmap{position:fixed;inset:0;width:100%;height:100%;z-index:20;display:none;background:#111d;cursor:crosshair} #maphint{position:fixed;z-index:21;top:12px;left:50%;transform:translateX(-50%);padding:10px 14px;border-radius:10px;background:#101722ee;color:#fff;display:none;text-align:center;max-width:90vw} #maphint button{margin-left:10px;border:1px solid #ffffff55;background:#293548;color:white;border-radius:6px;padding:6px 10px}

/* ===== v24: menú chill ===== */
body{--ar:255,180,138;--a2r:255,126,182;--a:#ffb48a;--a2:#ff7eb6;--ink:#f7f0ff;--ink2:#d2c6ea;--card:rgba(28,20,52,.6);--btn:rgba(255,255,255,.075);--btn-h:rgba(255,255,255,.17);--glow:rgba(255,154,107,.42);font-family:Nunito,ui-rounded,"SF Pro Rounded","Segoe UI",system-ui,sans-serif}
body[data-mood="1"]{--ar:169,180,255;--a2r:212,155,255;--a:#a9b4ff;--a2:#d49bff;--card:rgba(14,18,46,.62);--glow:rgba(127,140,255,.42)}
body[data-mood="2"]{--ar:255,217,138;--a2r:255,159,178;--a:#ffd98a;--a2:#ff9fb2;--card:rgba(38,30,66,.58);--glow:rgba(255,201,160,.42)}

#bg{position:fixed;inset:0;z-index:3;display:none;background:#1a1330}
body[data-scene=home] #bg{display:block}
#bgc{position:absolute;inset:0;width:100%;height:100%;display:block}
#bgv{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 40%,transparent 52%,rgba(8,4,24,.55) 100%)}
#logo{position:absolute;display:block;visibility:hidden;opacity:0;left:calc(clamp(20px,6vw,96px) + 480px + clamp(24px,4vw,64px));right:clamp(20px,4vw,64px);top:50%;transform:translateY(-54%);pointer-events:none;min-width:0;max-width:100%;box-sizing:border-box;transition:opacity .2s ease}
/* v48: el logo depende de la escena de inicio, no del texto exacto de un h2. */
body[data-scene=home] #logo{display:block!important;visibility:visible!important;opacity:1!important}
body[data-scene=game] #logo{visibility:hidden!important;opacity:0!important}
body.on-intro #logo{display:block!important;visibility:visible!important;opacity:1!important}
#logo h1{margin:0;max-width:100%;font-weight:900;font-size:clamp(48px,7.2vw,116px);line-height:.9;letter-spacing:-.045em;overflow-wrap:normal;word-break:normal;background:linear-gradient(180deg,#fff 5%,rgb(var(--ar)) 62%,rgb(var(--a2r)) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 8px 30px var(--glow))}
#logo p{margin:18px 0 0;max-width:20em;font-size:clamp(15px,1.7vw,21px);font-weight:600;line-height:1.4;color:var(--ink);text-shadow:0 2px 14px rgba(20,8,40,.55)}
#tip{position:absolute;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));text-align:center;font-size:13px;font-weight:600;color:rgba(255,255,255,.72);text-shadow:0 1px 8px #000b;transition:opacity .6s;pointer-events:none;padding:0 16px}
body.on-intro #tip{opacity:1}

#dim{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:0;transition:opacity .25s;background:radial-gradient(90% 80% at 50% 45%,rgba(24,14,48,.28),rgba(10,6,26,.7));backdrop-filter:blur(6px) saturate(1.1);-webkit-backdrop-filter:blur(6px) saturate(1.1)}
body[data-scene=game].menu-open #dim{opacity:1}

#mus{position:fixed;z-index:6;right:calc(14px + env(safe-area-inset-right,0px));top:calc(14px + env(safe-area-inset-top,0px));display:none;align-items:center;gap:10px;padding:9px 16px 9px 13px;border-radius:999px;border:1px solid #ffffff2b;background:rgba(20,14,40,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:var(--ink);font:700 13px Nunito,ui-rounded,system-ui,sans-serif;cursor:pointer;transition:background .15s,border-color .15s}
#mus:hover,#mus:focus-visible{background:rgba(var(--ar),.22);border-color:rgba(var(--ar),.7);outline:none}
#mus .eq{display:flex;gap:2px;align-items:flex-end;height:14px}
#mus .eq i{width:3px;height:100%;border-radius:2px;background:var(--a);transform-origin:bottom;transform:scaleY(.25)}
#mus.on .eq i{animation:eq 1s ease-in-out infinite}
#mus.on .eq i:nth-child(2){animation-delay:-.35s;animation-duration:.8s}
#mus.on .eq i:nth-child(3){animation-delay:-.6s;animation-duration:1.2s}
@keyframes eq{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
body.boot #logo h1{animation:rise 1s cubic-bezier(.2,.7,.2,1) both}
body.boot #logo p{animation:rise 1s .25s cubic-bezier(.2,.7,.2,1) both}
body.boot #m.home{animation:fadein .9s .35s both}

#m{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(460px,92vw);box-sizing:border-box;max-height:86vh;overflow:auto;z-index:5;display:none;padding:20px;color:var(--ink);background:var(--card);backdrop-filter:blur(22px) saturate(1.35);-webkit-backdrop-filter:blur(22px) saturate(1.35);border:1px solid rgba(255,255,255,.17);border-radius:26px;box-shadow:0 24px 80px #0007,inset 0 1px 0 #ffffff26;scrollbar-width:thin;scrollbar-color:#ffffff40 transparent}
#m.wide{width:min(760px,96vw);max-height:92vh}
#m h2{margin:2px 4px 10px;font-size:24px;font-weight:800;letter-spacing:.2px;color:var(--ink)}
#m p{margin:0 0 14px;padding:11px 14px;border-radius:14px;background:#ffffff0f;border:1px solid #ffffff12;color:var(--ink2);line-height:1.5;font-size:14px}
#m button{display:flex;align-items:center;gap:12px;width:100%;box-sizing:border-box;min-height:46px;margin:6px 0;padding:8px 14px 8px 9px;border-radius:16px;border:1px solid #ffffff17;background:var(--btn);color:var(--ink);font:700 14.5px Nunito,ui-rounded,"Segoe UI",system-ui,sans-serif;text-align:left;cursor:pointer;transition:background .15s,transform .15s,border-color .15s,box-shadow .15s}
#m button::before{content:attr(data-icon);display:grid;place-items:center;flex:0 0 30px;width:30px;height:30px;border-radius:10px;background:#ffffff14;font-size:16px}
#m button:hover:not(:disabled),#m button:focus-visible{background:var(--btn-h);border-color:rgba(var(--ar),.7);transform:translateX(3px);box-shadow:0 0 0 3px rgba(var(--ar),.18),0 8px 22px #0003;outline:none}
#m button:active:not(:disabled){transform:translateX(1px) scale(.99)}
#m button:disabled{opacity:.38;cursor:default}

#m.home{left:clamp(20px,6vw,96px);top:50%;transform:translateY(-50%);width:min(480px,92vw);flex-wrap:wrap;gap:8px;align-content:flex-start;padding:18px}
#m.home h2{display:none}
#m.home p{flex:1 1 100%;margin:0 0 4px}
#m.home button{flex:1 1 calc(50% - 4px);width:auto;margin:0;min-width:0;padding-right:10px;font-size:14px}
#m.home button:first-of-type{flex-basis:100%;min-height:58px;font-size:17px;font-weight:800;color:#2a1630;border-color:transparent;background:linear-gradient(135deg,rgb(var(--ar)),rgb(var(--a2r)));box-shadow:0 10px 30px var(--glow)}
#m.home button:first-of-type::before{background:#ffffff59;flex-basis:34px;width:34px;height:34px;font-size:18px}
#m.home button:first-of-type:hover:not(:disabled),#m.home button:first-of-type:focus-visible{filter:brightness(1.06);transform:translateY(-2px);box-shadow:0 14px 36px var(--glow)}

#m .sub{color:var(--ink2);font-size:12.5px;line-height:1.45;opacity:.88}
#m .card{background:#ffffff0d;border:1px solid #ffffff1a;border-radius:16px;padding:11px 14px;margin:8px 0}
#m .card.ok{border-color:rgba(var(--ar),.65);background:rgba(var(--ar),.1)}
#m .card.lock{opacity:.55}
#m .row{display:flex;gap:10px;align-items:center;justify-content:space-between}
#m .bar{height:8px;border-radius:5px;background:#00000055;overflow:hidden;margin:7px 0 3px}
#m .bar>i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--a),var(--a2))}
#m .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
#m kbd{background:#ffffff14;border:1px solid #ffffff2a;border-bottom-width:3px;border-radius:7px;padding:2px 8px;font:700 12px ui-monospace,Menlo,Consolas,monospace;color:var(--a)}
#m table{width:100%;border-collapse:collapse}
#m td{padding:7px 4px;border-bottom:1px solid #ffffff14;color:var(--ink)}
#m h3{margin:16px 4px 4px;font-size:14.5px;font-weight:800;color:var(--a)}


#m .sets{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px;margin-bottom:6px}
#m .setbox{background:#ffffff0d;border:1px solid #ffffff17;border-radius:18px;padding:4px 14px 6px}
#m .setbox h3{margin:12px 0 4px}
#m .setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;border-bottom:1px solid #ffffff10}
#m .setrow:last-child{border-bottom:0}
#m .setrow>span{font-weight:700;font-size:14px;line-height:1.25}
#m .setrow button{display:block;width:auto;min-height:0;margin:0;padding:0;gap:0;box-shadow:none;border:0;border-radius:0;background:none;font:inherit;transform:none}
#m .setrow button::before{display:none}
#m .setrow button:hover:not(:disabled),#m .setrow button:focus-visible{transform:none;box-shadow:none;background:none}
#m .setrow button.sw{position:relative;flex:0 0 46px;width:46px;height:26px;border-radius:13px;background:#ffffff26;transition:background .18s}
#m .setrow button.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 2px 6px #0005;transition:transform .18s}
#m .setrow button.sw[aria-checked=true]{background:linear-gradient(135deg,rgb(var(--ar)),rgb(var(--a2r)))}
#m .setrow button.sw[aria-checked=true]::after{transform:translateX(20px)}
#m .setrow button.sw:focus-visible,#m .segs button:focus-visible{outline:2px solid rgba(var(--ar),.9);outline-offset:2px}
#m .segs{display:flex;gap:2px;padding:3px;border-radius:12px;background:#00000040;flex-wrap:wrap;justify-content:flex-end}
#m .segs button{padding:5px 10px;border-radius:9px;font-weight:700;font-size:12.5px;color:var(--ink2);transition:background .15s,color .15s}
#m .segs button:hover:not(.on){background:#ffffff1c}
#m .segs button.on{background:linear-gradient(135deg,rgb(var(--ar)),rgb(var(--a2r)));color:#2a1630}

/* ===== v26: sectores ===== */
#m .ban{position:relative;display:flex;align-items:center;gap:14px;margin:-4px -4px 12px;padding:14px 16px 21px;border-radius:20px;overflow:hidden;background:linear-gradient(120deg,rgba(var(--ar),.34),rgba(var(--a2r),.10) 72%),rgba(255,255,255,.04);border:1px solid rgba(var(--ar),.38)}
#m .ban::after{content:"";position:absolute;left:0;right:0;bottom:0;height:7px;background:var(--strip);opacity:.92}
#m .bico{flex:0 0 64px;width:64px;height:64px;display:grid;place-items:center;border-radius:16px;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.3),rgba(var(--ar),.28) 60%,rgba(0,0,0,.25));border:1px solid rgba(255,255,255,.28);box-shadow:0 8px 22px var(--glow),inset 0 1px 0 #fff4}
#m .bico img{width:44px;height:44px;image-rendering:pixelated;filter:drop-shadow(0 3px 0 rgba(0,0,0,.35))}
#m .btx{min-width:0}
#m .btx h2{margin:0;font-size:26px;line-height:1.1}
#m .btag{margin-top:4px;font-size:13px;font-weight:600;color:var(--ink2)}
#m .chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
#m .chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px 4px 7px;border-radius:999px;background:#ffffff12;border:1px solid #ffffff1f;font-weight:800;font-size:13px}
#m .chip img{width:18px;height:18px;image-rendering:pixelated}
#m button.sp::before{content:"";background:var(--sp) center/24px 24px no-repeat,#ffffff12;image-rendering:pixelated}
#m.sect button:hover:not(:disabled),#m.sect button:focus-visible{border-color:rgba(var(--ar),.8)}

/* pausa: dos columnas */
#m.duo{flex-wrap:wrap;gap:8px;align-content:flex-start}
#m.duo>*{flex:1 1 100%}
#m.duo>button{flex:1 1 calc(50% - 4px);margin:0;min-width:0}
#m.duo>button:first-of-type{flex-basis:100%;min-height:56px;font-size:16.5px;font-weight:800;color:#2a1630;border-color:transparent;background:linear-gradient(135deg,rgb(var(--ar)),rgb(var(--a2r)));box-shadow:0 10px 30px var(--glow)}
#m.duo>button:first-of-type::before{background:#ffffff59;font-size:18px}
#m.duo>.ban{margin:-4px -4px 4px}
#m.duo>.chips{margin:0 0 4px}

/* inventario: cuadrícula de huecos */
#m.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;align-content:start}
#m.grid>*{grid-column:1/-1}
#m.grid>button{grid-column:auto;flex-direction:column;justify-content:center;text-align:center;min-height:122px;margin:0;padding:14px 8px 10px;gap:8px;font-size:13px;line-height:1.3;border-radius:18px;background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.04))}
#m.grid>button::before{width:54px;height:54px;flex:0 0 54px;border-radius:14px;font-size:26px;background-size:40px 40px;background-color:rgba(0,0,0,.22)}
#m.grid>button.sp::before{background:var(--sp) center/40px 40px no-repeat,rgba(0,0,0,.22)}
#m.grid>button.eq{border-color:#ffd166;box-shadow:0 0 0 2px rgba(255,209,102,.35),0 8px 24px rgba(255,209,102,.18);opacity:1}
#m.grid>button.eq:disabled{opacity:1}
#m.grid>button.lock{opacity:.4;filter:grayscale(1)}
#m.grid>button:disabled:not(.lock):not(.eq){opacity:.8}
#m.grid>button:last-child{grid-column:1/-1;flex-direction:row;min-height:46px;padding:8px 14px 8px 9px;text-align:left;justify-content:flex-start;gap:12px;font-size:14.5px}
#m.grid>button:last-child::before{width:30px;height:30px;flex-basis:30px;font-size:16px;background:#ffffff14}
@media(max-width:520px){#m.grid>button{min-height:108px}}
@media(min-width:901px) and (max-width:1120px){
 #logo{left:clamp(520px,52vw,590px);right:24px;max-width:none}
 #logo h1{font-size:clamp(38px,5vw,58px);line-height:.94}
 #logo p{font-size:14px;margin-top:12px}
}
@media(min-width:1121px){#logo{left:clamp(560px,46vw,760px);right:clamp(28px,5vw,84px)}}
@media(max-width:900px){
 #m.home{left:50%;top:auto;bottom:max(12px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(480px,94vw);max-height:58vh}
 #logo{left:12px;right:12px;top:calc(4vh + env(safe-area-inset-top,0px));transform:none;text-align:center;max-width:none}
 #logo h1{font-size:clamp(38px,10.5vw,82px);line-height:.98}
 #logo h1 br{display:none}
 #logo p{margin:8px auto 0;font-size:clamp(12px,3.4vw,15px)}
 #tip{display:none}
}
@media(max-width:560px){#logo{top:calc(3vh + env(safe-area-inset-top,0px))}#logo p{max-width:90vw}#m.home{max-height:56vh;padding:12px}#m.home button{font-size:12.5px;min-height:42px}#m.home button:first-of-type{font-size:15px;min-height:48px}}
@media(max-width:560px){#m .grid2{grid-template-columns:1fr}}
@media(max-width:520px){#m{padding:14px;border-radius:22px}#m button{min-height:44px;font-size:14px}}
@media(max-height:520px){#logo{top:calc(8px + env(safe-area-inset-top,0px));transform:none}#logo h1{font-size:clamp(30px,5vw,52px);line-height:.92}#logo p{margin-top:6px;font-size:12px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body><canvas id="c"></canvas><canvas id="mm" width="150" height="150"></canvas><div id="dim"></div><div id="bg"><canvas id="bgc"></canvas><div id="bgv"></div><div id="logo" aria-label="Distrito Cero"><h1>Distrito<br>Cero</h1><p>Tu ciudad. Tus reglas. Tu historia.</p></div><div id="tip"></div></div><button id="mus" type="button" aria-label="Música del menú"><span class="eq"><i></i><i></i><i></i></span><span id="mt"></span></button><div id="m"></div><canvas id="worldmap"></canvas><div id="maphint">Mapa completo · haz clic para poner un marcador · M para cerrar <button id="clearway">Quitar marcador</button></div>
<script>
'use strict';
const $=i=>document.getElementById(i),cv=$('c'),g=cv.getContext('2d'),mm=$('mm').getContext('2d'),worldmap=$('worldmap'),wmg=worldmap.getContext('2d');
let mapOpen=false,waypoint=null,mapRect=null;
let W,H;const rs=()=>{W=cv.width=innerWidth;H=cv.height=innerHeight;worldmap.width=innerWidth*devicePixelRatio;worldmap.height=innerHeight*devicePixelRatio;worldmap.style.width=innerWidth+'px';worldmap.style.height=innerHeight+'px';if(mapOpen)drawWorldMap()};addEventListener('resize',rs);rs();
const L=480,N=6,C=[60,440,1000,1440,2060,2460],WS=4000,WC=2900,WX=5600,MS=.7,RW=120,PI=Math.PI,TAU=PI*2,rd=(a,b)=>a+Math.random()*(b-a),ri=n=>Math.random()*n|0,cl=(v,a,b)=>v<a?a:v>b?b:v,ds=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),rc=i=>C[i],nr=p=>{let b=0;for(let i=1;i<N;i++)if(Math.abs(C[i]-p)<Math.abs(C[b]-p))b=i;return b};
const ad=(a,b)=>{let d=(b-a)%TAU;if(d>PI)d-=TAU;if(d<-PI)d+=TAU;return d};
/* ---------- mapa ---------- */
const B=[],S=[],STREETLIGHTS=[],map=document.createElement('canvas');map.width=Math.ceil(WX*MS);map.height=Math.ceil(WS*MS);const m=map.getContext('2d');m.setTransform(MS,0,0,MS,0,0);
m.fillStyle='#3a3e46';m.fillRect(0,0,WX,WS);
const pal=['#8d6e63','#78909c','#a1887f','#90a4ae','#b0775a','#7e8aa6','#9c8f7a','#6d7f73'];
const SH={'0,2':'home','0,1':'food','1,0':'clo','0,4':'arm','1,2':'car','2,0':'tun','2,1':'prop','1,3':'pay','3,1':'cas','4,3':'bnk','3,4':'mis','4,2':'hos','5,4':'food','5,3':'mue','4,5':'arm','2,2':'gym','3,2':'cin','2,4':'pol','2,3':'gas'};

/* v56: policía menos inmediata, escalado gradual y persecuciones más legibles. */
/* v56: rebalanceo policial: delitos proporcionales, respuesta gradual y más margen de fuga. */
(function(){
  crime=function(n,e){
    const current=P.wanted||0;
    // Matar a un agente provoca una búsqueda seria; repetir delitos la intensifica.
    if(e){P.wanted=Math.min(5,current>0?current+1:3);P.lost=0;P.safe=Math.max(P.safe||0,4.5);return;}
    // Los delitos solo se detectan si hay agentes cerca. Un daño a un agente pesa más
    // que una infracción corriente, pero no dispara siempre el nivel de búsqueda.
    if(!cops(700))return;
    const serious=n>=2;
    const chance=serious?(current?0.62:0.58):(current?0.34:0.22);
    if(Math.random()<chance){
      if(current===0)P.wanted=serious?2:1;
      else P.wanted=Math.min(5,current+1);
      P.safe=Math.max(P.safe||0,4.5);
    }
    P.lost=0;
  };
  const aiCarV54=aiCar;
  aiCar=function(c,dt){
    aiCarV54(c,dt);
    if(!c||!c.ai||c.dead||c===P.car)return;
    const cs=Math.cos(c.a),sn=Math.sin(c.a);let nearest=Infinity;
    for(const o of cars){if(o===c||o.dead||!o.ai)continue;const dx=o.x-c.x,dy=o.y-c.y;const f=dx*cs+dy*sn,l=Math.abs(-dx*sn+dy*cs);if(f>0&&f<100&&l<23)nearest=Math.min(nearest,f);}
    if(nearest<72){const factor=Math.max(0,(nearest-18)/54);c.f=Math.min(c.f,Math.max(0,c.d.mx*.60*factor));c.vx=Math.cos(c.a)*c.f;c.vy=Math.sin(c.a)*c.f;}
  };
  const mkPedV54=mkPed;
  mkPed=function(x,y,o={}){
    let nx=x,ny=y;
    if(!o.cop&&pedBad({z:zoneOf(x,y)},x,y)){
      let found=false;
      for(let r=24;r<=120&&!found;r+=12){
        for(let a=0;a<Math.PI*2;a+=Math.PI/8){const tx=x+Math.cos(a)*r,ty=y+Math.sin(a)*r;if(tx<24||ty<24||tx>WX-24||ty>WS-24||hitR({x:tx,y:ty},14))continue;if(!pedBad({z:zoneOf(tx,ty)},tx,ty)){nx=tx;ny=ty;found=true;break;}}
      }
    }
    return mkPedV54(nx,ny,o);
  };
  // v57: recoloca los contactos narrativos en zonas peatonales válidas, no sobre calzadas.
  const contacts57=window.V42Contacts||[];
  const occupied57=[];
  for(const c of contacts57){
    const ox=c.x,oy=c.y;
    const valid57=(x,y)=>x>28&&y>28&&x<WX-28&&y<WS-28&&
      !hitR({x,y},15)&&!pedBad({z:zoneOf(x,y)},x,y)&&
      !occupied57.some(q=>Math.hypot(q.x-x,q.y-y)<85);
    if(!valid57(ox,oy)){
      let best=null;
      // Prioriza la acera más cercana al punto previsto para conservar la relación con el local.
      for(let r=18;r<=420&&!best;r+=9){
        for(let j=0;j<48;j++){
          const a=j*Math.PI/24,x=ox+Math.cos(a)*r,y=oy+Math.sin(a)*r;
          if(valid57(x,y)){best={x,y};break;}
        }
      }
      if(best){c.x=best.x;c.y=best.y;}
    }
    occupied57.push({x:c.x,y:c.y});
  }
})();

(function(){
  const aiCarV61=aiCar;
  aiCar=function(c,dt){
    if(!c||!c.ai||c.dead||c===P.car){aiCarV61(c,dt);return;}
    const beforeX=c.x,beforeY=c.y,beforeF=Math.abs(c.f||0);
    aiCarV61(c,dt);
    if(!c.ai||c.dead)return;

    // Frenada progresiva ante vehículos próximos: evita choques por alcanzar
    // demasiado deprisa a un coche que acaba de reducir la marcha.
    const cs=Math.cos(c.a),sn=Math.sin(c.a);
    let front=Infinity,side=Infinity;
    for(const o of cars){
      if(o===c||o.dead)continue;
      const dx=o.x-c.x,dy=o.y-c.y;
      const f=dx*cs+dy*sn,l=Math.abs(-dx*sn+dy*cs);
      if(f>0&&f<115&&l<29){front=Math.min(front,f);side=Math.min(side,l);}
    }
    if(front<78){
      const safe=Math.max(0,(front-20)/58);
      const cap=c.d.mx*(c.g?.48:.55)*safe;
      if(c.f>cap)c.f=Math.max(cap,c.f-420*dt);
      c.vx=Math.cos(c.a)*c.f;c.vy=Math.sin(c.a)*c.f;
    }

    // Detecta un atasco real, no una parada breve en un semáforo o cruce.
    const moved=Math.hypot(c.x-beforeX,c.y-beforeY);
    const obstructed=front<64||cars.some(o=>o!==c&&!o.dead&&Math.hypot(o.x-c.x,o.y-c.y)<43);
    const nearPlayer=Math.hypot(c.x-P.x,c.y-P.y)<115;
    if(moved<Math.max(1,dt*5)&&beforeF<18&&obstructed&&!nearPlayer){
      c.v61Stuck=(c.v61Stuck||0)+dt;
    }else c.v61Stuck=Math.max(0,(c.v61Stuck||0)-dt*1.5);

    // Tras varios segundos bloqueado, libera el coche con una maniobra breve
    // y controlada; no teletransporta el vehículo ni cambia su ruta.
    if(c.v61Stuck>4.5&&!(c.cop&&P.wanted>0)){
      c.v61Stuck=0;
      c.v61Nudge=.32;
      c.v61Side=Math.random()<.5?-1:1;
    }
    if(c.v61Nudge>0){
      c.v61Nudge=Math.max(0,c.v61Nudge-dt);
      c.a+=c.v61Side*1.05*dt;
      c.f=Math.max(c.f,Math.min(34,c.d.mx*.22));
      c.vx=Math.cos(c.a)*c.f;c.vy=Math.sin(c.a)*c.f;
    }
  };

  window.DISTRITO_CERO_V50={...oldDiagV61,version:'61.0',trafficAssist:true};
  window.DISTRITO_CERO_V49=window.DISTRITO_CERO_V50;
})();

/* ===== Distrito Cero v65 · economía consistente, contactos seguros y protección de partidas ===== */
(function(){
  // 1) Normaliza el estado de una partida antes de serializarlo; conserva los campos desconocidos
  // para no borrar datos de sistemas anteriores.
  const finiteOr=(v,f)=>Number.isFinite(Number(v))?Number(v):f;
  const normalizeSnapshotV65=(raw)=>{
    const d=raw&&typeof raw==='object'?{...raw}:{};
    d.money=Math.max(0,finiteOr(d.money,0));
    d.bank=Math.max(0,finiteOr(d.bank,0));
    d.hp=Math.max(1,Math.min(100,finiteOr(d.hp,100)));
    d.lv=Math.max(1,Math.floor(finiteOr(d.lv,1)));
    d.xp=Math.max(0,finiteOr(d.xp,0));
    d.pts=Math.max(0,Math.floor(finiteOr(d.pts,0)));
    d.wanted=0; // la búsqueda policial no se guarda como penalización permanente
    for(const k of ['own','res','clip','sk','props','mh','bag','garage','ach','stats','eggs','hid']){
      if(d[k]==null)d[k]=['mh','bag','garage','hid'].includes(k)?[]:{};
    }
    if(!Array.isArray(d.mh))d.mh=[];
    if(!Array.isArray(d.bag))d.bag=[];
    if(!Array.isArray(d.garage))d.garage=[];
    if(!Array.isArray(d.hid))d.hid=[];
    if(!d.stats||typeof d.stats!=='object'||Array.isArray(d.stats))d.stats={};
    if(!d.ach||typeof d.ach!=='object'||Array.isArray(d.ach))d.ach={};
    return d;
  };
  if(typeof snap==='function'){
    const snapV65=snap;
    snap=function(){return normalizeSnapshotV65(snapV65())};
  }

  // 2) Evita precios inválidos o callbacks rotos en las compras. No cambia precios legítimos.
  if(typeof buy==='function'){
    const buyV65=buy;
    buy=function(cost,callback){
      const price=Number(cost);
      if(!Number.isFinite(price)||price<0){msg('No se ha podido procesar el precio. No se ha cobrado nada.');return false;}
      if(typeof callback!=='function'){msg('Esta compra no está disponible ahora mismo.');return false;}
      if(!P||!Number.isFinite(Number(P.money))||P.money<price){msg('Dinero insuficiente');return false;}
      const before=P.money;
      try{
        buyV65(price,callback);
        // El sistema original gestiona el cobro. Si un callback falla, evita que quede saldo negativo.
        if(P.money<0)P.money=0;
        return P.money!==before || price===0;
      }catch(err){
        P.money=Math.max(0,before);
        msg('La operación ha fallado; se ha protegido tu saldo.');
        return false;
      }
    };
  }

  // 3) Reubica contactos de historia en puntos caminables, fuera de obstáculos y calzadas.
  // Se conserva el array original y sus IDs para no romper diálogos, misiones ni marcadores.
  const contacts=window.V42Contacts;
  if(Array.isArray(contacts)&&typeof hitR==='function'){
    const valid=(q)=>q.x>28&&q.y>28&&q.x<WX-28&&q.y<WS-28&&
      !hitR({x:q.x,y:q.y},14)&&
      !(typeof pedBad==='function'&&pedBad({z:typeof zoneOf==='function'?zoneOf(q.x,q.y):undefined},q.x,q.y));
    for(const c of contacts){
      if(!c||!Number.isFinite(c.x)||!Number.isFinite(c.y)||valid(c))continue;
      let found=null;
      for(let r=24;r<=260&&!found;r+=12){
        for(let i=0;i<24;i++){
          const a=i*Math.PI/12,q={x:c.x+Math.cos(a)*r,y:c.y+Math.sin(a)*r};
          if(valid(q)){found=q;break;}
        }
      }
      if(found){c.x=found.x;c.y=found.y;}
    }
  }

  // 4) Comprobación defensiva de datos de jugador al cargar o cambiar entre modos.
  // No toca dinero/progreso válidos ni borra misiones guardadas.
  if(P&&typeof P==='object'){
    P.money=Math.max(0,finiteOr(P.money,0));
    P.bank=Math.max(0,finiteOr(P.bank,0));
    P.hp=Math.max(1,Math.min(100,finiteOr(P.hp,100)));
    P.lv=Math.max(1,Math.floor(finiteOr(P.lv,1)));
    P.xp=Math.max(0,finiteOr(P.xp,0));
    P.pts=Math.max(0,Math.floor(finiteOr(P.pts,0)));
    for(const k of ['bag','garage','garageTypes','mh','hid'])if(!Array.isArray(P[k]))P[k]=[];
    if(!P.stats||typeof P.stats!=='object'||Array.isArray(P.stats))P.stats={};
    if(!P.ach||typeof P.ach!=='object'||Array.isArray(P.ach))P.ach={};
  }

  const diag=window.DISTRITO_CERO_V50||{};
  window.DISTRITO_CERO_V50={...diag,version:'65.0',saveSanityChecks:true,economyGuards:true,storyContactsSafe:true};
  window.DISTRITO_CERO_V49=window.DISTRITO_CERO_V50;
})();

// Minijuegos diarios usan el día del juego como retos y carreras; cambiar el reloj del sistema no reinicia su cobro.
(function(){
  if(!P||typeof P!=='object')return;
  const v68=()=>{if(!P.v68||typeof P.v68!=='object')P.v68={};if(!P.v68.raceBonusPaid||typeof P.v68.raceBonusPaid!=='object')P.v68.raceBonusPaid={};return P.v68};
  const state=v68(),day=Number(P.day)||0;
  // Limpia únicamente claves antiguas de este control; no altera dinero ni récords.
  for(const k of Object.keys(state.raceBonusPaid)){
    const m=k.match(/^rank:(-?\d+):/);
    if(m&&Number(m[1])<day-3)delete state.raceBonusPaid[k];
  }
  // Registrar el control en el guardado para que recargar no permita volver a cobrar el bonus.
  if(typeof snap==='function'){
    const snapV68=snap;

})();
