<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dominó</title>
<style>
:root{--bg1:#5b1a30;--bg2:#1d060d;--a:#e6b64f;--a2:#cf9a2c;--a3:#6f4e0c;--ai:#2b1a00;--ink:#f8f0e0}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font:16px/1.3 "Avenir Next","Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--a);outline-offset:2px}
.ib{width:42px;height:42px;border-radius:13px;border:0;background:#ffffff1f;box-shadow:inset 0 0 0 1px #ffffff22;font-size:20px;flex:none;transition:.12s}
.ib:hover{background:#ffffff33}.ib:active{transform:scale(.92)}
/* ---------- pantallas de inicio ---------- */
.screen{position:fixed;inset:0;z-index:20;display:none;grid-template-columns:minmax(0,1fr);justify-items:center;align-content:center;align-content:safe center;gap:1.5em;padding:max(1.4em,env(safe-area-inset-top)) 1.2em max(1.4em,env(safe-area-inset-bottom));overflow:auto;scrollbar-width:none;font-size:clamp(14px,1.1vw + 9px,19px);background:radial-gradient(120% 90% at 50% 0%,var(--bg1),var(--bg2))}
@supports(background:color-mix(in srgb,red,blue)){.screen{background:radial-gradient(80% 55% at 50% -5%,color-mix(in srgb,var(--a) 20%,transparent),transparent 70%),radial-gradient(120% 90% at 50% 0%,var(--bg1),var(--bg2))}}
.screen::-webkit-scrollbar{display:none}
.screen.on{display:grid}
.brand{position:relative;display:grid;justify-items:center;gap:.9em;text-align:center;max-width:100%}
.fl{position:absolute;left:0;top:0;pointer-events:none;opacity:.32;animation:fl linear infinite;will-change:transform}
@keyframes fl{from{transform:translateY(105vh) rotate(0)}to{transform:translateY(-25vh) rotate(360deg)}}
.logo{position:relative;font-weight:900;font-size:clamp(46px,17vmin,110px);line-height:.92;letter-spacing:.01em;background:linear-gradient(var(--a),var(--a2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;filter:drop-shadow(0 .05em 0 var(--a3)) drop-shadow(0 .14em .14em #000a)}
.tag{opacity:.8;letter-spacing:.02em}
.panel{position:relative;width:min(100%,26em);display:grid;gap:1em;padding:1.3em;border-radius:1.6em;background:linear-gradient(#ffffff20,#ffffff0b);border:1px solid #ffffff2b;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 1.6em 3.6em #0008,inset 0 1px 0 #ffffff38}
.lbl{display:flex;align-items:center;gap:.7em;font-size:.76em;text-transform:uppercase;letter-spacing:.13em;opacity:.72;font-weight:800}
.lbl::after{content:"";flex:1;height:1px;background:#ffffff2a}
.hint{font-size:.82em;opacity:.7;line-height:1.4}
.seg{display:flex;flex-wrap:wrap;gap:.35em;padding:.3em;border-radius:1.1em;background:#00000033;box-shadow:inset 0 .1em .35em #0007}
.seg button{flex:1 1 auto;min-width:2.8em;padding:.7em .8em;border:0;border-radius:.85em;background:transparent;font-weight:800;opacity:.72;transition:.15s}
.seg button:hover{opacity:1;background:#ffffff1a}
.seg button.a{opacity:1;background:linear-gradient(var(--a),var(--a2));color:var(--ai);box-shadow:0 .18em 0 var(--a3),0 .6em 1em #0005;transform:translateY(-1px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.55em;border:0;border-radius:1em;padding:.85em 1.2em;font-weight:800;transition:transform .1s,box-shadow .1s,background .15s}
.btn.p{position:relative;overflow:hidden;background:linear-gradient(var(--a),var(--a2));color:var(--ai);box-shadow:0 .3em 0 var(--a3),0 .9em 1.6em #0007;font-size:1.3em;padding:.7em;letter-spacing:.02em}
.btn.p::after{content:"";position:absolute;top:0;bottom:0;width:38%;left:-60%;background:linear-gradient(100deg,#fff0,#ffffff70,#fff0);transform:skewX(-20deg);animation:shine 3.6s infinite}
@keyframes shine{55%,100%{left:140%}}
.btn.p:active{transform:translateY(.25em);box-shadow:0 .05em 0 var(--a3)}
.btn.s{background:#ffffff1c;color:var(--ink);box-shadow:inset 0 0 0 1px #ffffff26}
.btn.s:hover{background:#ffffff33}.btn.s:active{transform:scale(.97)}
.btn[data-act=play]::before,.btn[data-act=resume]::before{content:"▶"}
.mcard .btn[data-act=play]::before,.btn[data-act=again]::before,.btn[data-act=fresh]::before{content:"↻"}
.btn[data-act=toHome]::before{content:"⌂"}
.btn[data-act=rulesBtn]::before,.btn[data-act=rulesHome]::before{content:"?"}
.btn[data-act=closeRules]::before{content:"✓"}
.row{display:flex;gap:.7em}.row .btn{flex:1}
.screen.on .brand>*,.screen.on .panel{animation:up .6s cubic-bezier(.2,.8,.2,1) both}
.screen.on .brand>:nth-child(2){animation-delay:.07s}.screen.on .brand>:nth-child(3){animation-delay:.14s}.screen.on .panel{animation-delay:.2s}
@keyframes up{from{opacity:0;transform:translateY(1.2em)}}
@media(min-width:680px) and (min-aspect-ratio:12/10){
 .screen.on{grid-template-columns:minmax(0,1fr) minmax(0,26em);column-gap:min(6vw,4em);justify-content:center}
 .brand{gap:1.2em}}
@media(max-height:520px){.screen{gap:.9em}.logo{font-size:clamp(34px,15vmin,70px)}.panel{padding:1em;gap:.7em}}
/* ---------- ventanas ---------- */
.modal{position:fixed;inset:0;z-index:30;display:none;place-items:center;padding:1em;background:#000b;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:clamp(14px,1.1vw + 9px,19px)}
.modal.on{display:grid}
.mcard{width:min(100%,24em);max-height:92dvh;overflow:auto;scrollbar-width:thin;background:linear-gradient(#ffffff14,#ffffff06),linear-gradient(var(--bg1),var(--bg2));border:1px solid #ffffff2e;border-radius:1.8em;padding:1.5em;display:grid;gap:.9em;box-shadow:0 2em 5em #000c,inset 0 1px 0 #ffffff33;animation:pop .28s cubic-bezier(.2,1.2,.4,1)}
@keyframes pop{from{transform:scale(.9) translateY(.6em);opacity:0}}
.mcard h2{font-size:2em;text-align:center;line-height:1.05;background:linear-gradient(var(--a),var(--a2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;filter:drop-shadow(0 .06em 0 var(--a3))}
.mcard p.c{text-align:center;opacity:.85;font-size:.95em;line-height:1.4}
.rules{counter-reset:r;display:grid;gap:.75em;font-size:.95em;line-height:1.5}
.rules div{position:relative;padding-left:1.9em}
.rules div::before{content:counter(r);counter-increment:r;position:absolute;left:0;top:.12em;width:1.35em;height:1.35em;border-radius:50%;background:var(--a);color:var(--ai);font-size:.78em;font-weight:900;display:grid;place-items:center}
.rules b{color:var(--a)}
.cf{position:fixed;top:-20px;width:9px;height:15px;z-index:40;pointer-events:none;animation:cf 3.2s ease-in forwards}
@keyframes cf{to{transform:translateY(110vh) rotate(720deg)}}
@media(prefers-reduced-motion:reduce){.fl,.cf,.btn.p::after,.screen.on .brand>*,.screen.on .panel{animation:none}}

html,body{background:radial-gradient(circle at 50% 20%,var(--bg1),var(--bg2))}
#app{height:100dvh;display:grid;grid-template-rows:auto auto 1fr auto;padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom);gap:6px}
header{display:flex;gap:8px;padding:8px 0 0;align-items:stretch}
#chips{flex:1;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.pc{flex:1;min-width:92px;padding:7px 10px;border-radius:14px;background:#ffffff12;border:2px solid transparent;opacity:.7;transition:.2s}
.pc b{display:block;font-size:13px}.pc small{font-size:11px;opacity:.75}
.pc.on{opacity:1;border-color:var(--a);background:#ffffff26;box-shadow:0 6px 18px #0006}
.mbs{display:flex;gap:2px;margin-top:4px;height:14px}
.mb{width:8px;height:14px;border-radius:2px;background:linear-gradient(#f5ead0,#d8c9a2);box-shadow:0 1px 0 #8a7a50}
#table{min-height:0;border-radius:28px;border:9px solid #6e4522;border-image:none;background:radial-gradient(ellipse at 50% 35%,#2f7551,#143c28 75%);box-shadow:inset 0 0 60px #0009,0 12px 34px #000a,0 0 0 2px #3a2210;display:grid}
#board{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;align-content:center;align-items:center;overflow:auto;padding:12px;--tw:clamp(24px,5.4vw,40px)}
.eb{padding:6px 10px;border-radius:999px;background:var(--a);color:var(--ai);font-weight:800;font-size:13px;box-shadow:0 3px 0 var(--a3);animation:pu 1.4s infinite}
@keyframes pu{50%{transform:scale(1.08)}}
.t{width:calc(var(--tw)*2);height:var(--tw);display:flex;flex:none;position:relative;background:linear-gradient(160deg,#fffdf4,#e9dcba);border-radius:calc(var(--tw)*.2);box-shadow:inset 0 -3px 0 #c7b78a,0 3px 0 #a99868,0 7px 12px #0008}
.t.v{width:var(--tw);height:calc(var(--tw)*2);flex-direction:column}
.t::after{content:"";position:absolute;left:50%;top:14%;bottom:14%;width:2px;background:#9d8c5c;transform:translateX(-1px);border-radius:2px}
.t.v::after{left:14%;right:14%;top:50%;bottom:auto;width:auto;height:2px;transform:translateY(-1px)}
.h{flex:1;display:grid;grid:repeat(3,1fr)/repeat(3,1fr);padding:calc(var(--tw)*.11)}
.h i{place-self:center;width:68%;height:68%;border-radius:50%}
.h i.on{background:radial-gradient(circle at 35% 30%,#666,#0d0d0d);box-shadow:inset 0 -1px 1px #fff3}
.t.end{outline:3px solid var(--a);outline-offset:2px}
footer{padding:2px 0 12px;display:grid;gap:6px;justify-items:center}
#msg{font-weight:700;min-height:20px;text-align:center;font-size:15px}
#pick{display:none;gap:10px}#pick.on{display:flex}
#pick button{padding:10px 18px;border:0;border-radius:12px;background:var(--a);color:var(--ai);font-weight:800;box-shadow:0 3px 0 var(--a3)}
#hand{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:16px 0 2px;--tw:clamp(32px,9.5vw,54px)}
#hand .t{transition:.15s;cursor:pointer}
#hand .t.ok{transform:translateY(-12px);box-shadow:inset 0 -3px 0 #c7b78a,0 0 0 3px var(--a),0 12px 18px #000a}
#hand .t.no{opacity:.45}
#hand .t.sel{transform:translateY(-22px)}
.hb{display:grid;gap:4px}.hb .ib{width:38px;height:38px;font-size:17px}
#cnt{display:flex;gap:6px;align-items:center;justify-content:center;font-size:12px;opacity:.9}
#cnt span{padding:3px 8px;border-radius:999px;background:#ffffff18;font-weight:700}
#cnt span.z{opacity:.35;text-decoration:line-through}
#cnt span.lo{background:var(--a);color:var(--ai)}
.t.new{animation:tp .4s ease-out}
@keyframes tp{from{transform:scale(1.6) rotate(10deg);opacity:0}}
.tl{display:flex;gap:6px;justify-content:center;--tw:26px}
.seats3{display:flex;gap:8px;justify-content:center}
</style></head><body>
<div id="app">
<header><div id="chips"></div><div class="hb"><button class="ib" data-act="pause" aria-label="Pausa">☰</button><button class="ib" data-act="snd" aria-label="Sonido">🔊</button></div></header>
<div id="cnt"></div>
<main id="table"><div id="board"></div></main>
<footer><div id="msg"></div><div id="pick"></div><div id="hand"></div></footer>
</div>
<section id="home" class="screen"><div class="brand">
 <div class="logo">DOMINÓ</div>
 <div class="tl" id="homeTiles"></div>
 <div class="tag">Doble seis · pozo y puntos por ronda</div></div>
 <div class="panel"><div id="homeBody" style="display:grid;gap:12px"></div>
  <button class="btn p" data-act="play">Jugar</button>
  <button class="btn s" data-act="rulesHome">Reglas</button></div>
</section>
<script>
const Kit=(()=>{
 const q=s=>document.querySelector(s),acts={};
 function floats(host,items,n=14){host.querySelectorAll('.fl').forEach(e=>e.remove());
  for(let i=0;i<n;i++){const e=document.createElement('div');e.className='fl';e.innerHTML=items[i%items.length];
   e.style.cssText=`left:${Math.random()*96}%;animation-duration:${16+Math.random()*16}s;animation-delay:${-Math.random()*30}s;font-size:${26+Math.random()*30}px`;host.appendChild(e)}}
 function modal(html){let m=q('#modal');if(!m){m=document.createElement('div');m.id='modal';m.className='modal';m.setAttribute('role','dialog');m.setAttribute('aria-modal','true');document.body.appendChild(m)}
  m.innerHTML=`<div class=mcard>${html}</div>`;m.classList.add('on')}
 function close(){const m=q('#modal');if(m)m.classList.remove('on')}
 function confetti(cols){for(let i=0;i<70;i++){const e=document.createElement('div');e.className='cf';
  e.style.cssText=`left:${Math.random()*100}%;background:${cols[i%cols.length]};animation-delay:${Math.random()*.8}s;animation-duration:${2.6+Math.random()*1.6}s;border-radius:${Math.random()<.4?'50%':'2px'}`;
  document.body.appendChild(e);setTimeout(()=>e.remove(),5000)}}
 function rules(title,items){modal(`<h2>${title}</h2><div class=rules>${items.map(t=>`<div>${t}</div>`).join('')}</div><button class="btn p" data-act=closeRules>Entendido</button>`)}
 let ac=null,muted=false;
 function tone(f,d,type='sine',v=.12,delay=0,slide=0){if(muted)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(f*slide,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d)}catch(e){}}
 const SF={click:()=>tone(520,.06,'triangle',.08),move:()=>tone(300,.1,'triangle',.1,0,1.5),roll:()=>{for(let i=0;i<6;i++)tone(180+Math.random()*220,.05,'square',.035,i*.055)},hit:()=>tone(220,.28,'sawtooth',.1,0,.35),home:()=>[660,880].forEach((f,i)=>tone(f,.15,'triangle',.1,i*.09)),win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.26,'triangle',.12,i*.13)),err:()=>tone(140,.14,'square',.07),card:()=>tone(420,.07,'sine',.1,0,1.8),drop:()=>tone(260,.12,'sine',.12,0,.5)};
 const sfx=n=>SF[n]&&SF[n]();
 acts.snd=b=>{muted=!muted;b.textContent=muted?'🔇':'🔊'};
 document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;if(b.classList.contains('btn')||b.closest('.seg')||b.closest('.seats'))sfx('click');if(acts[b.dataset.act])acts[b.dataset.act](b)});
 addEventListener('keydown',e=>{if(e.key!=='Escape')return;const m=q('#modal');if(m&&m.classList.contains('on')){acts.resume?acts.resume():close()}else if(!q('.screen.on')&&acts.pause)acts.pause()});
 acts.closeRules=()=>{close();if(Kit.afterRules)Kit.afterRules()};
 return{q,acts,floats,modal,close,confetti,rules,sfx,afterRules:null}})();

const $=Kit.q;
const P={0:[],1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
const NM=['Tú','Bot 1','Bot 2','Bot 3'];
const cfg={n:2,target:100};
let G=null,score=[0,0,0,0],PAUSE=false,GID=0;
function later(fn,ms){const id=G.id;setTimeout(function w(){if(!G||G.id!==id)return;if(PAUSE)return setTimeout(w,200);fn()},ms)}
const half=v=>`<div class=h>${[...Array(9)].map((_,j)=>`<i class="${P[v].includes(j)?'on':''}"></i>`).join('')}</div>`;
const tile=(t,cls='',at='')=>`<div ${at} class="t ${t[0]===t[1]?'v':''} ${cls}">${half(t[0])}${half(t[1])}</div>`;
const sum=h=>h.reduce((s,t)=>s+t[0]+t[1],0);
const ends=()=>G.chain.length?[G.chain[0][0],G.chain[G.chain.length-1][1]]:null;
function sides(t){const e=ends();if(!e)return['R'];const s=[];if(t.includes(e[0]))s.push('L');if(t.includes(e[1]))s.push('R');if(s.length===2&&e[0]===e[1])return['R'];return s}

function newRound(){
 const all=[];for(let a=0;a<=6;a++)for(let b=a;b<=6;b++)all.push([a,b]);
 for(let i=all.length;i>1;){const j=Math.random()*i--|0;[all[i],all[j]]=[all[j],all[i]]}
 G={id:++GID,n:cfg.n,hands:[],chain:[],turn:0,passes:0,over:false,msg:'',pick:null,lock:false};
 for(let p=0;p<G.n;p++)G.hands.push(all.splice(0,7));G.yard=all;
 let best=-1,bp=0,bi=0;
 G.hands.forEach((h,p)=>h.forEach((t,i)=>{const v=(t[0]===t[1]?100:0)+t[0]+t[1];if(v>best){best=v;bp=p;bi=i}}));
 G.turn=bp;$('#home').classList.remove('on');Kit.close();place(bp,bi,'R',true)}
function place(p,i,side,first){
 const t=G.hands[p].splice(i,1)[0],e=ends();
 if(!e)G.chain.push(t);
 else if(side==='R')G.chain.push(t[0]===e[1]?t:[t[1],t[0]]);
 else G.chain.unshift(t[1]===e[0]?t:[t[1],t[0]]);
 G.chain[side==='L'&&e?0:G.chain.length-1].fresh=1;Kit.sfx('card');
 G.passes=0;G.pick=null;G.msg=`${NM[p]} ${first?'abre con':'juega'} ${t[0]}|${t[1]}`;
 if(!G.hands[p].length)return endRound(p,false);
 next()}
function next(){G.turn=(G.turn+1)%G.n;render();turn()}
function turn(){if(G.over)return;const p=G.turn,h=G.hands[p];
 if(!h.some(t=>sides(t).length)){G.lock=true;render();
  later(()=>{if(G.yard.length){h.push(G.yard.pop());Kit.sfx('drop');G.msg=`${NM[p]} roba una ficha`;render();turn()}
   else{G.passes++;Kit.sfx('err');G.msg=`${NM[p]} pasa`;G.lock=false;if(G.passes>=G.n)return endRound(null,true);next()}},p?900:1000);return}
 G.lock=false;render();
 if(p)later(()=>{const o=[];h.forEach((t,i)=>sides(t).forEach(s=>o.push({i,s,v:t[0]+t[1]+(t[0]===t[1]?3:0)+Math.random()})));o.sort((a,b)=>b.v-a.v);place(p,o[0].i,o[0].s)},950)}
function endRound(w,blocked){G.over=true;
 if(blocked){let m=1e9;G.hands.forEach((h,p)=>{if(sum(h)<m){m=sum(h);w=p}})}
 const pts=G.hands.reduce((s,h,p)=>p===w?s:s+sum(h),0);score[w]+=pts;render();
 later(()=>{const champ=cfg.target&&score[w]>=cfg.target;
  Kit.sfx(w===0?'win':'err');if(w===0||champ)Kit.confetti(['#e6b64f','#fff','#d94b5b']);
  Kit.modal(`<h2>${champ?(w===0?'¡Ganas la partida!':'Gana '+NM[w]+' la partida'):(w===0?'¡Ganas la ronda!':'Gana '+NM[w])}</h2><p class=c>${blocked?'Juego cerrado: gana quien suma menos. ':''}+${pts} puntos · Total: ${score.slice(0,G.n).map((s,i)=>NM[i]+' '+s).join(' · ')}</p>
  ${champ?'<button class="btn p" data-act=fresh>Nueva partida</button>':'<button class="btn p" data-act=again>Siguiente ronda</button>'}<button class="btn s" data-act=toHome>Menú principal</button>`)},900)}
function render(){if(!G)return;
 $('#chips').innerHTML=G.hands.map((h,p)=>`<div class="pc ${p===G.turn&&!G.over?'on':''}"><b>${NM[p]} · ${score[p]} pts</b><small>${h.length} fichas</small>${p?`<div class=mbs>${'<i class=mb></i>'.repeat(Math.min(h.length,9))}</div>`:''}</div>`).join('')+`<div class=pc><b>Pozo</b><small>${G.yard.length} fichas</small></div>`;
 const e=ends(),c=G.chain;
 if(G.bl!==c.length){G.bl=c.length;$('#board').innerHTML=(c.length?`<span class=eb>◀ ${e[0]}</span>`:'')+c.map((t,i)=>tile(t,(i===0||i===c.length-1?'end':'')+(t.fresh?' new':''))).join('')+(c.length?`<span class=eb>${e[1]} ▶</span>`:'');c.forEach(t=>delete t.fresh);const bd=$('#board');bd.scrollTop=bd.scrollHeight}
 $('#cnt').innerHTML='<span>Por salir</span>'+[0,1,2,3,4,5,6].map(n=>{const u=7-c.filter(t=>t.includes(n)).length-G.hands[0].filter(t=>t.includes(n)).length;return `<span class="${u<=0?'z':u<=1?'lo':''}">${n}·${Math.max(u,0)}</span>`}).join('');
 const hu=G.turn===0&&!G.over&&!G.lock;
 $('#hand').innerHTML=G.hands[0].map((t,i)=>tile(t,(hu?(sides(t).length?'ok':'no'):'')+(G.pick===i?' sel':''),`data-act=tile data-i=${i}`)).join('');
 $('#msg').textContent=G.over?G.msg:hu?(G.pick!=null?'¿Por qué extremo?':'Tu turno: elige una ficha resaltada'):G.msg||`Turno de ${NM[G.turn]}…`;
 const pk=$('#pick');pk.className=G.pick!=null?'on':'';
 if(G.pick!=null)pk.innerHTML=`<button data-act=side data-s=L>◀ Izquierda (${e[0]})</button><button data-act=side data-s=R>Derecha (${e[1]}) ▶</button>`}
Kit.acts.tile=b=>{if(!G||G.turn!==0||G.over||G.lock||PAUSE)return;const i=+b.dataset.i,s=sides(G.hands[0][i]);
 if(!s.length)return;if(s.length===1)place(0,i,s[0]);else{G.pick=G.pick===i?null:i;render()}};
Kit.acts.side=b=>{if(G&&G.pick!=null)place(0,G.pick,b.dataset.s)};

function home(){$('#homeBody').innerHTML=`<div class=lbl>Jugadores (tú + bots)</div><div class=seg>${[2,3,4].map(n=>`<button data-act=cn data-v=${n} class="${cfg.n==n?'a':''}">${n}</button>`).join('')}</div>
 <div class=lbl>La partida termina al llegar a</div><div class=seg>${[[50,'50 pts'],[100,'100 pts'],[0,'Rondas sueltas']].map(([v,t])=>`<button data-act=ct data-v=${v} class="${cfg.target==v?'a':''}">${t}</button>`).join('')}</div>`}
function showHome(){G=null;PAUSE=false;Kit.close();$('#home').classList.add('on');home();
 $('#homeTiles').innerHTML=[[6,6],[3,5],[0,4],[2,2]].map(t=>tile(t)).join('');
 Kit.floats($('#home'),[[1,2],[4,6],[3,3],[5,0],[6,1],[2,5]].map(t=>`<div style="--tw:30px">${tile(t)}</div>`),12)}
Kit.acts.cn=b=>{cfg.n=+b.dataset.v;home()};Kit.acts.ct=b=>{cfg.target=+b.dataset.v;home()};
const RULES=['<b>Objetivo:</b> quedarte sin fichas antes que los demás.','Cada jugador recibe 7 fichas. Empieza quien tenga el doble más alto.','En tu turno juega una ficha que coincida con uno de los dos extremos (marcados en dorado). Si encaja en ambos, eliges lado.','Si no puedes jugar, robas del pozo hasta encontrar una ficha. Con el pozo vacío, pasas.','Gana la ronda quien se queda sin fichas, o quien suma menos si el juego se cierra. Se lleva los puntos de las fichas de los demás.'];
Kit.acts.rulesHome=()=>{Kit.afterRules=null;Kit.rules('Reglas',RULES)};
Kit.acts.rulesBtn=()=>{Kit.afterRules=()=>{Kit.afterRules=null;Kit.acts.pause()};Kit.rules('Reglas',RULES)};
Kit.acts.pause=()=>{if(!G)return;PAUSE=true;Kit.modal(`<h2>Pausa</h2><button class="btn p" data-act=resume>Continuar</button><div class=row><button class="btn s" data-act=rulesBtn>Reglas</button><button class="btn s" data-act=fresh>Reiniciar</button></div><button class="btn s" data-act=toHome>Menú principal</button>`)};
Kit.acts.resume=()=>{PAUSE=false;Kit.close()};
Kit.acts.toHome=showHome;
Kit.acts.fresh=()=>{score=[0,0,0,0];PAUSE=false;newRound()};
Kit.acts.again=()=>{PAUSE=false;newRound()};
Kit.acts.play=()=>{score=[0,0,0,0];PAUSE=false;newRound()};
showHome();
</script></body></html>
