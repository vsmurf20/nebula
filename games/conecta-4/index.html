<style>

/* ---------- pantallas de inicio ---------- */

@supports(background:color-mix(in srgb,red,blue)){.screen{background:radial-gradient(80% 55% at 50% -5%,color-mix(in srgb,var(--a) 20%,transparent),transparent 70%),radial-gradient(120% 90% at 50% 0%,var(--bg1),var(--bg2))}}

/* ---------- ventanas ---------- */
.modal{position:fixed;inset:0;z-index:30;display:none;place-items:center;padding:1em;background:#000b;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:clamp(14px,1.1vw + 9px,19px)}
.modal.on{display:grid}

html,body{background:radial-gradient(circle at 50% 25%,var(--bg1),var(--bg2))}
#app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto;padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom)}

</style></head><body>

<section id="home" class="screen"><div class="brand">
 <div class="logo">CONECTA<br>4</div>
 <div class="dots"><i class="dsc" style="--c:#ef4b55"></i><i class="dsc" style="--c:#f7c948"></i><i class="dsc" style="--c:#ef4b55"></i><i class="dsc" style="--c:#f7c948"></i></div>
 <div class="tag">Alinea cuatro fichas antes que tu rival</div></div>
 <div class="panel"><div id="homeBody" style="display:grid;gap:12px"></div>
  <button class="btn p" data-act="play">Jugar</button>

<script>
const Kit=(()=>{
 const q=s=>document.querySelector(s),acts={};
 function floats(host,items,n=14){host.querySelectorAll('.fl').forEach(e=>e.remove());
  for(let i=0;i<n;i++){const e=document.createElement('div');e.className='fl';e.innerHTML=items[i%items.length];
   e.style.cssText=`left:${Math.random()*96}%;animation-duration:${16+Math.random()*16}s;animation-delay:${-Math.random()*30}s;font-size:${26+Math.random()*30}px`;host.appendChild(e)}}
 function modal(html){let m=q('#modal');if(!m){m=document.createElement('div');m.id='modal';m.className='modal';m.setAttribute('role','dialog');m.setAttribute('aria-modal','true');document.body.appendChild(m)}
  m.innerHTML=`<div class=mcard>${html}</div>`;m.classList.add('on')}
 function close(){const m=q('#modal');if(m)m.classList.remove('on')}
 function confetti(cols){for(let i=0;i<70;i++){const e=document.createElement('div');e.className='cf';
  e.style.cssText=`left:${Math.random()*100}%;background:${cols[i%cols.length]};animation-delay:${Math.random()*.8}s;animation-duration:${2.6+Math.random()*1.6}s;border-radius:${Math.random()<.4?'50%':'2px'}`;
  document.body.appendChild(e);setTimeout(()=>e.remove(),5000)}}
 function rules(title,items){modal(`<h2>${title}</h2><div class=rules>${items.map(t=>`<div>${t}</div>`).join('')}</div><button class="btn p" data-act=closeRules>Entendido</button>`)}
 let ac=null,muted=false;
 function tone(f,d,type='sine',v=.12,delay=0,slide=0){if(muted)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(f*slide,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d)}catch(e){}}
 const SF={click:()=>tone(520,.06,'triangle',.08),move:()=>tone(300,.1,'triangle',.1,0,1.5),roll:()=>{for(let i=0;i<6;i++)tone(180+Math.random()*220,.05,'square',.035,i*.055)},hit:()=>tone(220,.28,'sawtooth',.1,0,.35),home:()=>[660,880].forEach((f,i)=>tone(f,.15,'triangle',.1,i*.09)),win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.26,'triangle',.12,i*.13)),err:()=>tone(140,.14,'square',.07),card:()=>tone(420,.07,'sine',.1,0,1.8),drop:()=>tone(260,.12,'sine',.12,0,.5)};
 const sfx=n=>SF[n]&&SF[n]();
 acts.snd=b=>{muted=!muted;b.textContent=muted?'🔇':'🔊'};
 document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;if(b.classList.contains('btn')||b.closest('.seg')||b.closest('.seats'))sfx('click');if(acts[b.dataset.act])acts[b.dataset.act](b)});
 addEventListener('keydown',e=>{if(e.key!=='Escape')return;const m=q('#modal');if(m&&m.classList.contains('on')){acts.resume?acts.resume():close()}else if(!q('.screen.on')&&acts.pause)acts.pause()});
 acts.closeRules=()=>{close();if(Kit.afterRules)Kit.afterRules()};
 return{q,acts,floats,modal,close,confetti,rules,sfx,afterRules:null}})();

const $=Kit.q;
const COL=['#ef4b55','#f7c948'],NAME=['Rojo','Amarillo'];
const cfg={mode:'ia',depth:4,first:0};
let hist=[],hintCol=-1,hintT=0,B=null,turn=0,over=false,win=null,fall=null,hover=-1,wins=[0,0],busy=false,PAUSE=false,RID=0;
const R=6,Cn=7,ORD=[3,2,4,1,5,0,6];
const isAI=p=>cfg.mode==='ia'&&p===1,pname=p=>cfg.mode==='ia'?(p===1?'Bot':'Tú'):NAME[p];
function later(fn,ms){const id=RID;setTimeout(function w(){if(id!==RID)return;if(PAUSE)return setTimeout(w,200);fn()},ms)}
function reset(){RID++;hist=[];hintCol=-1;B=Array.from({length:R},()=>Array(Cn).fill(-1));over=false;win=null;fall=null;busy=false;turn=cfg.first;hover=-1;PAUSE=false;$('#home').classList.remove('on');Kit.close();render();aiTurn()}
function row(c){for(let r=R-1;r>=0;r--)if(B[r][c]<0)return r;return -1}
function check(r,c,p){for(const[dr,dc]of[[0,1],[1,0],[1,1],[1,-1]]){const cells=[[r,c]];
 for(const s of[1,-1]){let i=r+dr*s,j=c+dc*s;while(i>=0&&i<R&&j>=0&&j<Cn&&B[i][j]===p){cells.push([i,j]);i+=dr*s;j+=dc*s}}
 if(cells.length>=4)return cells}return null}
function drop(c){if(!B||over||busy||PAUSE||row(c)<0)return;const r=row(c),p=turn;B[r][c]=p;hist.push({c,r,p});hintCol=-1;Kit.sfx('drop');busy=true;fall={c,r,p,y:-1,v:0,t:performance.now()}}
function landed(){const{c,r,p}=fall;fall=null;Kit.sfx('card');const w=check(r,c,p);
 if(w){Kit.sfx('win');over=true;win=w;wins[p]++;busy=false;render();const id=RID;setTimeout(()=>{if(id===RID)end(p)},1200);return}
 if(B[0].every(v=>v>=0)){over=true;busy=false;render();const id=RID;setTimeout(()=>{if(id===RID)end(-1)},900);return}
 turn=1-p;busy=false;render();aiTurn()}
function aiTurn(){if(over||!isAI(turn))return;busy=true;later(()=>{const c=best();busy=false;drop(c)},650)}
function evalB(p){let s=0;for(let r=0;r<R;r++)if(B[r][3]===p)s+=3;else if(B[r][3]===1-p)s-=3;
 const w4=(r,c,dr,dc)=>{let a=0,o=0;for(let k=0;k<4;k++){const v=B[r+dr*k][c+dc*k];if(v===p)a++;else if(v>=0)o++}
  if(a&&o)return 0;if(a===3)return 5;if(a===2)return 2;if(o===3)return -4;if(o===2)return -1;return 0};
 for(let r=0;r<R;r++)for(let c=0;c<Cn;c++){if(c+3<Cn)s+=w4(r,c,0,1);if(r+3<R)s+=w4(r,c,1,0);if(r+3<R&&c+3<Cn)s+=w4(r,c,1,1);if(r+3<R&&c>=3)s+=w4(r,c,1,-1)}
 return s}
function nega(d,a,b,p){let any=false;
 for(const c of ORD){const r=row(c);if(r<0)continue;any=true;B[r][c]=p;
  if(check(r,c,p)){B[r][c]=-1;return 1e5+d}
  const v=d<=1?-evalB(1-p):-nega(d-1,-b,-a,1-p);B[r][c]=-1;
  if(v>a)a=v;if(a>=b)break}
 return any?a:0}
function best(p=1,dep=cfg.depth){let bc=3,bv=-1e9;
 for(const c of ORD){const r=row(c);if(r<0)continue;B[r][c]=p;let v;
  if(check(r,c,p))v=1e6;else v=-nega(dep-1,-1e9,1e9,1-p);
  B[r][c]=-1;v+=dep<3?Math.random()*40:Math.random()*.1;if(v>bv){bv=v;bc=c}}
 if(dep<3&&Math.random()<.25){const o=ORD.filter(c=>row(c)>=0);return o[Math.random()*o.length|0]}
 return bc}
function render(){if(!B)return;
 $('#chips').innerHTML=[0,1].map(p=>`<div class="pc ${turn===p&&!over?'on':''}" style="--c:${COL[p]}"><b></b><span>${pname(p)}<small>${NAME[p]}</small></span><strong>${wins[p]}</strong></div>`).join('');
 $('#msg').textContent=over?(win?`¡Gana ${pname(B[win[0][0]][win[0][1]])}!`:'Empate'):isAI(turn)?'El bot está pensando…':`Turno de ${pname(turn)}: toca una columna`}
function fit(){const s=$('#stage'),w=s.clientWidth,h=s.clientHeight,k=Math.min(w/7,h/7.2),d=devicePixelRatio||1,c=$('#cv');c.style.width=k*7+'px';c.style.height=k*7.2+'px';c.width=Math.round(k*7*d);c.height=Math.round(k*7.2*d)}
addEventListener('resize',fit);
function disc(x,cx,cy,r,p,a=1){x.globalAlpha=a;const g=x.createRadialGradient(cx-r*.3,cy-r*.3,r*.1,cx,cy,r);g.addColorStop(0,'#fffb');g.addColorStop(.28,COL[p]);g.addColorStop(1,p?'#b8890f':'#a8222c');
 x.fillStyle=g;x.beginPath();x.arc(cx,cy,r,0,7);x.fill();x.strokeStyle='#0003';x.lineWidth=r*.12;x.beginPath();x.arc(cx,cy,r*.62,0,7);x.stroke();x.globalAlpha=1}
function draw(now){const cv=$('#cv'),W=cv.width;
 if(B&&fall&&!PAUSE){const dt=Math.min(.03,(now-fall.t)/1000);fall.t=now;fall.v+=60*dt;fall.y+=fall.v*dt;
  if(fall.y>=fall.r){if(fall.v>7&&!fall.b){fall.b=1;fall.v=-fall.v*.25;fall.y=fall.r-.01}else{fall.y=fall.r;landed()}}}
 else if(B&&fall)fall.t=now;
 if(W&&B){const x=cv.getContext('2d'),u=W/7;x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,W,cv.height);const oy=u*.2;
 if(hover>=0&&!over&&!busy&&!isAI(turn)&&row(hover)>=0){x.fillStyle='#ffffff1c';x.fillRect(hover*u,oy+u,u,6*u)}
 for(let r=0;r<R;r++)for(let c=0;c<Cn;c++)if(B[r][c]>=0&&!(fall&&fall.r===r&&fall.c===c))disc(x,(c+.5)*u,oy+(r+1.5)*u,u*.4,B[r][c]);
 if(fall)disc(x,(fall.c+.5)*u,oy+(fall.y+1.5)*u,u*.4,fall.p);
 if(hover>=0&&!over&&!busy&&!isAI(turn)&&row(hover)>=0)disc(x,(hover+.5)*u,oy+.5*u,u*.34,turn,.75);
 if(hintCol>=0&&now<hintT&&!over&&!busy){const k=.55+.45*Math.sin(now/130);disc(x,(hintCol+.5)*u,oy+.5*u,u*.34,turn,k);x.fillStyle='#fff';x.font=`900 ${u*.3}px sans-serif`;x.textAlign='center';x.textBaseline='middle';x.fillText('▼',(hintCol+.5)*u,oy+.5*u+u*.02)}
 x.save();x.beginPath();x.roundRect(u*.04,oy+u,u*6.92,u*6,u*.25);
 for(let r=0;r<R;r++)for(let c=0;c<Cn;c++){x.moveTo((c+.5)*u+u*.4,oy+(r+1.5)*u);x.arc((c+.5)*u,oy+(r+1.5)*u,u*.4,0,7,true)}
 const g=x.createLinearGradient(0,oy+u,0,oy+7*u);g.addColorStop(0,'#3a63dc');g.addColorStop(1,'#243f9f');x.fillStyle=g;x.fill('evenodd');x.restore();
 x.strokeStyle='#ffffff38';x.lineWidth=u*.035;x.beginPath();x.roundRect(u*.07,oy+u+u*.03,u*6.86,u*5.94,u*.24);x.stroke();
 x.strokeStyle='#0004';x.lineWidth=u*.03;for(let r=0;r<R;r++)for(let c=0;c<Cn;c++){x.beginPath();x.arc((c+.5)*u,oy+(r+1.5)*u,u*.4,0,7);x.stroke()}
 if(win){const k=.5+.5*Math.sin(now/150);x.strokeStyle='#fff';x.lineWidth=u*.09;win.forEach(([r,c])=>{x.globalAlpha=.4+k*.6;x.beginPath();x.arc((c+.5)*u,oy+(r+1.5)*u,u*.43,0,7);x.stroke()});const ws=win.slice().sort((a,b)=>a[1]-b[1]||a[0]-b[0]),a=ws[0],z=ws[ws.length-1];x.globalAlpha=.9;x.lineCap='round';x.lineWidth=u*.12;x.beginPath();x.moveTo((a[1]+.5)*u,oy+(a[0]+1.5)*u);x.lineTo((z[1]+.5)*u,oy+(z[0]+1.5)*u);x.stroke();x.globalAlpha=1}}
 requestAnimationFrame(draw)}
const colOf=e=>{const r=$('#cv').getBoundingClientRect();return Math.max(0,Math.min(6,Math.floor((e.clientX-r.left)/r.width*7)))};
$('#cv').addEventListener('pointermove',e=>{hover=colOf(e)});
$('#cv').addEventListener('pointerleave',()=>hover=-1);
$('#cv').addEventListener('pointerdown',e=>{if(!B||isAI(turn))return;hover=colOf(e);drop(hover)});
addEventListener('keydown',e=>{if(e.key>='1'&&e.key<='7'&&B&&!isAI(turn))drop(+e.key-1)});

function home(){const S=(k,a)=>`<div class=seg>${a.map(([v,t])=>`<button data-act=opt data-k=${k} data-v=${v} class="${cfg[k]==v?'a':''}">${t}</button>`).join('')}</div>`;
 $('#homeBody').innerHTML=`<div class=lbl>Modo</div>${S('mode',[['ia','Contra el bot'],['2p','2 jugadores']])}
 ${cfg.mode==='ia'?`<div class=lbl>Dificultad</div>${S('depth',[[2,'Fácil'],[4,'Medio'],[6,'Difícil']])}<div class=lbl>Empieza</div>${S('first',[[0,'Tú'],[1,'Bot']])}`:`<div class=lbl>Empieza</div>${S('first',[[0,'Rojo'],[1,'Amarillo']])}`}`}
Kit.acts.opt=b=>{const k=b.dataset.k;cfg[k]=k==='mode'?b.dataset.v:+b.dataset.v;if(k==='mode')cfg.first=0;wins=[0,0];home()};
function showHome(){B=null;RID++;PAUSE=false;Kit.close();$('#home').classList.add('on');home();Kit.floats($('#home'),['#ef4b55','#f7c948'].map(c=>`<i class=dsc style="--c:${c}"></i>`),12)}
function end(p){if(p>=0)Kit.confetti([COL[p],'#fff','#3a63dc']);
 Kit.modal(`<h2>${p<0?'Empate':'¡Gana '+pname(p)+'!'}</h2><p class=c>Marcador · ${pname(0)} ${wins[0]} – ${wins[1]} ${pname(1)}</p><button class="btn p" data-act=again>Revancha</button><button class="btn s" data-act=toHome>Menú principal</button>`)}
const RULES=['<b>Objetivo:</b> alinear 4 fichas de tu color en horizontal, vertical o diagonal.','Por turnos, toca (o pulsa 1-7) una columna: la ficha cae hasta la casilla libre más baja.','Si el tablero se llena sin ganador, es empate.','Contra el bot puedes elegir dificultad y quién empieza.'];
Kit.acts.rulesHome=()=>{Kit.afterRules=null;Kit.rules('Reglas',RULES)};
Kit.acts.rulesBtn=()=>{Kit.afterRules=()=>{Kit.afterRules=null;Kit.acts.pause()};Kit.rules('Reglas',RULES)};
Kit.acts.pause=()=>{if(!B)return;PAUSE=true;Kit.modal(`<h2>Pausa</h2><button class="btn p" data-act=resume>Continuar</button><div class=row><button class="btn s" data-act=rulesBtn>Reglas</button><button class="btn s" data-act=again>Reiniciar</button></div><button class="btn s" data-act=toHome>Menú principal</button>`)};
Kit.acts.resume=()=>{PAUSE=false;Kit.close()};
Kit.acts.toHome=showHome;
Kit.acts.undo=()=>{if(!B||busy||PAUSE||!hist.length)return;RID++;Kit.close();let h;
 do{h=hist.pop();B[h.r][h.c]=-1;if(over){if(win)wins[h.p]--;over=false;win=null}}while(cfg.mode==='ia'&&h.p===1&&hist.length);
 fall=null;busy=false;hintCol=-1;turn=h.p;Kit.sfx('click');render();aiTurn()};
Kit.acts.hint=()=>{if(!B||over||busy||PAUSE||isAI(turn))return;hintCol=best(turn,5);hintT=performance.now()+2600;Kit.sfx('click')};
Kit.acts.again=()=>{if(B)reset()};
Kit.acts.play=()=>{wins=[0,0];reset()};
fit();requestAnimationFrame(draw);showHome();
</script></body></html>
