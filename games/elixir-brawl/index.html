function pxify(n){if(n.nodeType==3){const t=n.nodeValue;if(!/\p{Extended_Pictographic}/u.test(t))return;const f=document.createDocumentFragment();let l=0,m;EMG.lastIndex=0;while(m=EMG.exec(t)){if(m.index>l)f.append(t.slice(l,m.index));const e=m[0];if(!IMC[e]){const im=new Image();im.className='px';im.alt=e;im.src=pxs(e,16).u;IMC[e]=im}f.append(IMC[e].cloneNode());l=m.index+e.length}if(l<t.length)f.append(t.slice(l));n.replaceWith(f)}
 else if(n.nodeType==1&&!/^(SCRIPT|STYLE|CANVAS|IMG|INPUT)$/.test(n.tagName))[...n.childNodes].forEach(pxify)}
new MutationObserver(ms=>{for(const m of ms){m.addedNodes.forEach(pxify);if(m.type=='characterData'&&m.target.isConnected)pxify(m.target)}}).observe(document.body,{childList:true,subtree:true,characterData:true});
pxify(document.body);
