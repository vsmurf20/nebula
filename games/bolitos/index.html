// ---------- física ----------
function col(a,b,e){const dx=b.x-a.x,dz=b.z-a.z,d2=dx*dx+dz*dz,rr=a.r+b.r;if(d2>=rr*rr||d2<1e-9)return;
 const d=Math.sqrt(d2),nx=dx/d,nz=dz/d,sm=a.im+b.im,o=(rr-d)/sm;a.x-=nx*o*a.im;a.z-=nz*o*a.im;b.x+=nx*o*b.im;b.z+=nz*o*b.im;
 const vn=(b.vx-a.vx)*nx+(b.vz-a.vz)*nz;if(vn>=0)return;const j=-(1+e)*vn/sm;
 a.vx-=j*nx*a.im;a.vz-=j*nz*a.im;b.vx+=j*nx*b.im;b.vz+=j*nz*b.im;
 [a,b].forEach(q=>{if(q.pin&&!q.st){const v=Math.hypot(q.vx,q.vz);if(v>.35){q.st=1;q.dx=q.vx/v;q.dz=q.vz/v}}});
 if(-vn>.4)snd(Math.min(1,-vn/5))}
function sub(dt){const b=ball;
 if(b.on){b.vx+=b.g?0:b.spin*K*(b.z<-L*.4?1:.25)*dt;b.x+=b.vx*dt;b.z+=b.vz*dt;
  if(!b.g&&Math.abs(b.x)>HW+.03){b.g=Math.sign(b.x);b.vx=0}
  if(b.g){const k=Math.min(1,10*dt);b.x+=(b.g*(HW+.125)-b.x)*k;b.y+=(R-.07-b.y)*k}
  if(b.z<-END||Math.hypot(b.vx,b.vz)<.4&&tt>.5){b.on=0;b.m.visible=false}}
 const A=pins.filter(o=>o.alive&&!o.rm);
 for(const o of A){if(o.vx||o.vz){o.x+=o.vx*dt;o.z+=o.vz*dt;const f=1-1.6*dt;o.vx*=f;o.vz*=f;if(Math.hypot(o.vx,o.vz)<.03)o.vx=o.vz=0}
  if(Math.abs(o.x)>HW+.28||o.z<-END+.05)o.rm=1}
 if(b.on&&!b.g){for(const o of A)col(b,o,.5);for(const o of obs)if(o.on)col(b,o,.35)}
 if(mode==2)for(const o of obs)if(o.on)for(const p of A)col(o,p,.4);
 for(let i=0;i<A.length;i++){const a=A[i];for(let j=i+1;j<A.length;j++){const c=A[j];if(a.vx||a.vz||c.vx||c.vz)col(a,c,.5)}}}
// ---------- puntuación ----------
function cum(p){const out=[];
 if(mode==2){let t=0;p.fr.forEach((f,i)=>{if(f.length){t+=f.reduce((a,b)=>a+b,0);out[i]=t}});return out}
 const r=p.fr.flat();let i=0,t=0;
 for(let f=0;f<10;f++){const a=r[i];if(a===undefined)break;
  if(a==N){const b=r[i+1],c=r[i+2];if(b===undefined||c===undefined)break;t+=N+b+c;i++}
  else{const b=r[i+1];if(b===undefined)break;if(a+b==N){const c=r[i+2];if(c===undefined)break;t+=N+c}else t+=a+b;i+=2}
  out[f]=t}return out}
const sym=(fr,j)=>{const k=fr[j];if(mode==2)return k;if(k==N)return'X';if((j==1||j==2&&fr[0]==N)&&fr[j-1]<N&&fr[j-1]+k==N)return'/';return k==0?'-':k};
function board(){let h='<table><tr><th></th>'+[...Array(10)].map((_,i)=>`<th>${i+1}</th>`).join('')+'<th>Σ</th></tr>';
 P.forEach((p,i)=>{const c=cum(p);let T=0;c.forEach(v=>T=v);p.T=T;h+=`<tr class="${i==cur.p&&st!='over'?'a':''}"><td style="color:hsl(${p.h} 90% 65%)">${p.n}</td>`;
  for(let f=0;f<10;f++){const fr=p.fr[f];h+=`<td><i>${fr.map((_,j)=>sym(fr,j)).join(' ')}</i><b>${c[f]??''}</b></td>`}h+=`<td><b>${T}</b></td></tr>`});
 $('sb').innerHTML=h+'</table>'}
// ---------- flujo de juego ----------
function sync(){px=$('sx').value/100;aim=$('sa').value/10;spin=$('ss').value/100}
['sx','sa','ss'].forEach(i=>$(i).oninput=sync);
function startTurn(){const p=P[cur.p];Object.assign(ball,{on:0,g:0,y:R,x:px,z:0,vx:0,vz:0});ball.m.material=mats[p.h==200?0:HUES.indexOf(p.h)];ball.m.visible=true;ball.m.quaternion.identity();
 st='aim';$('ctl').style.opacity=1;$('ctl').style.pointerEvents='auto';$('go').textContent='LANZAR';$('pw').style.display='none';prev.visible=true;
 $('who').innerHTML=`<span style="color:hsl(${p.h} 90% 65%)">${p.n}</span> · ${mode==2?'Nivel':'Turno'} ${cur.f+1}/10 · Lanzamiento ${cur.t+1}`;sync();board()}
function go(){au();if(AC&&AC.state=='suspended')AC.resume();
 if(st=='aim'){st='pow';pwT=0;$('go').textContent='¡AHORA!';$('pw').style.display='block'}
 else if(st=='pow'){const v=5.5+5.5*pw,a=aim*Math.PI/180;Object.assign(ball,{x:px,z:-.05,vx:v*Math.sin(a),vz:-v*Math.cos(a),spin,on:1,g:0,y:R});
  st='roll';tt=0;done=0;prev.visible=false;$('ctl').style.opacity=.2;$('ctl').style.pointerEvents='none';$('pw').style.display='none'}}
$('go').onclick=go;
addEventListener('keydown',e=>{if(st!='aim'&&st!='pow')return;const k=e.key.toLowerCase();
 const m={a:['sx',-4],d:['sx',4],arrowleft:['sa',-5],arrowright:['sa',5],q:['ss',-8],e:['ss',8]}[k];if(m){const s=$(m[0]);s.value=+s.value+m[1];sync()}
 if(k==' '){e.preventDefault();go()}});
function flash(t){const m=$('msg');m.textContent=t;m.classList.remove('s');void m.offsetWidth;m.classList.add('s')}
function finish(){st='res';const before=pins.filter(o=>o.alive&&!o.cnt).length;let k=0;
 pins.forEach(o=>{if(o.alive&&!o.cnt&&(o.st||o.rm)){o.cnt=1;k++}});
 const p=P[cur.p],fr=p.fr[cur.f];fr.push(k);const all=before-k==0;
 let end=0,reset=0;
 if(mode==2)end=all||cur.t==1?1:0,cur.t=end?0:1;
 else if(cur.f<9){if(cur.t==0&&!all)cur.t=1;else end=1}
 else if(cur.t==0){if(all)reset=1;cur.t=1}
 else if(cur.t==1){if(fr[0]==N){if(all)reset=1;cur.t=2}else if(all){reset=1;cur.t=2}else end=1}
 else end=1;
 if(mode==2&&end)cur.t=0;
 flash(all?(before==N?'¡PLENO!':mode==2?'¡NIVEL SUPERADO!':'¡SEMIPLENO!'):k==0?'Sin suerte…':k+' derribados');
 board();
 setTimeout(()=>{pins.forEach(o=>{if(o.cnt&&o.alive){o.alive=false;o.m.visible=false}});
  if(end){cur.t=0;cur.p++;if(cur.p>=NP){cur.p=0;cur.f++}if(cur.f>=10)return over();rack()}else if(reset)rack();
  startTurn()},1800)}
function over(){st='over';board();$('hud').style.display='none';const s=[...P].sort((a,b)=>b.T-a.T);
 $('res').innerHTML=s.map((p,i)=>`${i?'':'🏆 '}<b style="color:hsl(${p.h} 90% 65%)">${p.n}</b>: ${p.T} puntos`).join('<br>');$('end').style.display='flex'}
function newGame(){au();$('menu').style.display=$('end').style.display='none';$('hud').style.display='block';K=mode==2?1.5:.75;
 P=[...Array(NP)].map((_,i)=>({n:NAMES[i],h:HUES[i],fr:Array.from({length:10},()=>[]),T:0}));cur={p:0,f:0,t:0};rack();startTurn()}
// ---------- menú ----------
function pick(id,fn){[...$(id).querySelectorAll('button')].forEach(b=>b.onclick=()=>{$(id).querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');fn(b.dataset)})}
pick('mm',d=>mode=+d.m);pick('mmap',d=>{mapI=+d.k;buildMap()});pick('mp',d=>NP=+d.n);pick('mq',d=>{qual=+d.q;resize()});
$('start').onclick=newGame;$('again').onclick=newGame;$('tomenu').onclick=()=>{$('end').style.display='none';$('menu').style.display='flex';st='menu'};
// ---------- bucle ----------
const cp=new THREE.Vector3(0,1.2,4),cl=new THREE.Vector3(0,.3,-9),tp=new THREE.Vector3(),tl=new THREE.Vector3(),ax=new THREE.Vector3();
let last=performance.now();
function loop(t){requestAnimationFrame(loop);const dt=Math.min(.05,(t-last)/1000);last=t;
 if(st=='menu'||st=='over'){if(!pins[0].alive){rack()}ball.m.visible=false;prev.visible=false}
 if(st=='aim'||st=='pow'){ball.x=px;ball.z=0;ball.y=R;preview()}
 if(st=='pow'){pwT+=dt;pw=(1-Math.cos(pwT*3.4))/2;$('pwf').style.height=pw*100+'%'}
 if(st=='roll'){tt+=dt;for(let i=0;i<4;i++)sub(dt/4);
  if(!done&&!ball.on&&tt>1){const mv=pins.some(o=>o.alive&&!o.rm&&(o.vx||o.vz));if(!mv||tt>12)done=tt}
  if(!done&&tt>14)done=tt;if(done&&tt-done>.9)finish()}
 const sp=Math.hypot(ball.vx,ball.vz);
 if(ball.on&&sp>0){ax.set(ball.vz,0,-ball.vx).normalize();ball.m.rotateOnWorldAxis(ax,sp*dt/R)}
 ball.m.position.set(ball.x,ball.y,ball.z);
 if(rg)rg.gain.setTargetAtTime(ball.on&&!ball.g&&st=='roll'?Math.min(.3,sp*.03):0,AC.currentTime,.05);
 for(const o of pins){if(!o.alive||!o.m.visible)continue;
  if(o.rm){o.y-=dt*3;if(o.y<-.9){o.m.visible=false;continue}}else if(o.y>0)o.y=Math.max(0,o.y-3*dt);
  if(o.st){o.tilt=Math.min(1.5,o.tilt+dt*5);const v=Math.hypot(o.vx,o.vz);if(v>.15){o.dx=o.vx/v;o.dz=o.vz/v}ax.set(o.dz,0,-o.dx);o.m.quaternion.setFromAxisAngle(ax,o.tilt)}
  o.m.position.set(o.x,o.y+o.s*(.058+.132*Math.cos(o.tilt)),o.z)}
 if(st=='menu'||st=='over'){tp.set(Math.sin(t*.0002)*2.2,1.3,2.5);tl.set(0,.3,-9)}
 else if(st=='aim'||st=='pow'){tp.set(px*.7,.85,2.7);tl.set(px*.3,.05,-7)}
 else{const z=Math.max(ball.z+2.6,-L+3.4);tp.set(ball.x*.5,.8+(z<-L+4?.35:0),z);tl.set(0,.1,Math.max(ball.z-5,-L-.2))}
 const k=1-Math.exp(-3.5*dt);cp.lerp(tp,k);cl.lerp(tl,k);cam.position.copy(cp);cam.lookAt(cl);
 rd.render(sc,cam)}
resize();buildMap();rack();requestAnimationFrame(loop);
</script></body></html>
