$('#bspin').disabled=st.busy||st.left<=0;$('#lv').classList.toggle('dis',st.busy||st.left<=0);$('.card.debt').classList.toggle('dng',st.left<=2&&st.coins<st.debt);$('#hf').textContent=st.coins>=st.debt?'¡Deuda cubierta!':'Faltan '+(st.debt-st.coins)+' monedas';
const bp=$('#bpay');bp.disabled=st.busy||st.coins<st.debt||st.left<=0;bp.innerHTML=`PAGAR<br>${st.debt} 🪙`;bp.title='Paga ya y cobra +'+CFG.earlyBonus+' 🪙 por tirada restante';
const ks=Object.keys(st.items).filter(k=>lv(k));
$('#ch').innerHTML=ks.length?ks.map(k=>`<div class="ch"><big>${ai(k)}</big><div><b>${IT[k].n} ${lv(k)>1?'Nv '+lv(k):''}</b><small>${IT[k].d}</small></div></div>`).join(''):'<small style="opacity:.6">Aún no tienes amuletos. Págalos en la tienda tras cada deuda.</small>';
$('#cbx').innerHTML=CB.map(c=>{const a=cb(c.id);return `<div class='ch' style='opacity:${a?1:.45}'><span style='font-size:20px;width:34px;text-align:center;flex:none'>${a?'✨':'🔒'}</span><div><b>${c.n}</b><small>${a?c.d:c.k.map(k=>IT[k].n).join(' + ')+' → '+c.d}</small></div></div>`}).join('');
$('#pt').innerHTML=S.map(s=>`<div class="pr"><span>${sv(s.e).repeat(3)}</span><em>${s.v*(s.e==='🍀'&&lv('gclv')?2:1)}</em></div>`).join('')+`<div class="pr"><span>🍒 suelta</span><em>+${1+lv('cher')}</em></div>`+(lv('wild')?`<div class="pr"><span>🃏 comodín</span><em>${WILD.v}</em></div>`:'')+`<div class="pr"><span>Líneas activas</span><em>${LN().length}/12</em></div><small style="opacity:.6;display:block;margin-top:8px">Premio x${(1+.25*lv('mult')).toFixed(2)}${lv('combo')?' · racha '+st.streak:''}<br>Filas, figuras y columnas: 3 iguales desde la izquierda x1 · 4 x3 · 5 x8. 10 o más iguales en pantalla dan bonus. Si no llegas a la deuda, pierdes.</small>`}
$('#bspin').onclick=spin;$('#lv').onclick=spin;
$('#bpay').onclick=()=>{if(!st.busy&&st.coins>=st.debt&&st.left>0)settle(true)};
$('#mu').onclick=()=>{mute=!mute;$('#mu').textContent=mute?'🔇':'🔊'};
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='Enter'){e.preventDefault();spin()}});
st={coins:0,round:1,items:{},debt:CFG.base,left:0,busy:false,offers:[]};ui();
$('#ov').innerHTML=`<div class="modal"><h2>🍀 TRÉBOL ROTO</h2><p style="line-height:1.6">Tienes <b>${CFG.spins} tiradas</b> por ronda y una <b style="color:var(--red)">deuda</b> que pagar al agotarlas.<br>Combina símbolos en línea, junta monedas y paga.<br>Tras cada pago, compra <b>amuletos</b>… pero la deuda crece cada ronda.<br><small>Espacio / Enter para tirar · Si no llegas, se acabó.</small></p><button data-s="1" style="font-size:20px;padding:14px 30px">EMPEZAR</button>${best?`<p>Récord: ${best} rondas</p>`:''}</div>`;
$('#ov').classList.add('on');
</script></body></html>
