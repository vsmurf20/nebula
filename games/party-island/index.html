<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Party Island</title>
<style>
:root{--bg:#f3efe6;--fg:#1d2433;--pn:#fff;--ac:#ff7a1a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#141a2b;--fg:#f1f3f9;--pn:#222b45}}
:root[data-theme=dark]{--bg:#141a2b;--fg:#f1f3f9;--pn:#222b45}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Trebuchet MS',Verdana,sans-serif;-webkit-user-select:none;user-select:none}
#app{max-width:820px;margin:0 auto;padding:8px}
#stage{position:relative;border-radius:14px;overflow:hidden;border:3px solid var(--fg)}
canvas{display:block;width:100%;height:auto;touch-action:none;background:#7fd3ff}
#ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(20,26,43,.82);color:#fff;text-align:center;overflow:auto;padding:8px}
#ov h1{margin:4px;font-size:34px}#ov h2{margin:4px}#ov p{margin:4px 0;font-size:14px}#ov ol{text-align:left;margin:4px;padding-left:24px}
.row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:4px 0}
button{font:inherit;font-weight:700;padding:9px 14px;border-radius:10px;border:2px solid #0004;background:#ffd23b;color:#222;cursor:pointer;min-height:42px;transition:transform .1s}
button:hover{transform:translateY(-2px) scale(1.04)}button:active{transform:scale(.95)}
button.on{background:var(--ac);color:#fff;outline:3px solid #fff}
button.ch{background:var(--c);color:#fff}button.big{background:#3ccf6a;font-size:18px}
#hud{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.card{background:var(--pn);border-left:8px solid var(--c,#888);border-radius:8px;padding:5px 9px;font-size:14px;display:flex;flex-direction:column;flex:1;min-width:110px}
.card.cur{outline:3px solid var(--ac);transform:scale(1.03)}
#bar{background:var(--pn);border-radius:10px;padding:8px;min-height:64px;text-align:center}
.msg{margin-bottom:6px;font-size:15px}#log{font-size:12px;opacity:.8;margin-top:6px;min-height:60px}
#dice{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);width:96px;height:96px;background:#fff;color:#c22;border:5px solid #222;border-radius:20px;font:900 54px/86px Verdana;text-align:center;display:none;box-shadow:0 10px 0 #0005}
</style></head><body><div id="app">
<div id="stage"><canvas id="cv" width="800" height="480"></canvas><div id="dice"></div><div id="ov"></div></div>
<div id="hud"></div><div id="bar"></div><div id="log"></div></div>
<script>
const $=s=>document.querySelector(s),cv=$('#cv'),X=cv.getContext('2d'),bar=$('#bar'),ov=$('#ov');
const rnd=n=>Math.floor(Math.random()*n);
const sleep=async ms=>{await new Promise(r=>setTimeout(r,ms));if(G&&G.dead)throw 0};
/* ===== GUARDADO ===== */
const S=Object.assign({wins:{},games:0,mute:0,turns:10,diff:1,ch:0,best:0},(()=>{try{return JSON.parse(localStorage.getItem('pi')||'{}')}catch(e){return{}}})());
if(!S.wins||typeof S.wins!='object')S.wins={};
S.turns=[10,15,20].includes(S.turns)?S.turns:10;S.diff=[0,1,2].includes(S.diff)?S.diff:1;S.ch=Math.min(3,Math.max(0,+S.ch||0));
const save=()=>{try{localStorage.setItem('pi',JSON.stringify(S))}catch(e){}};
/* ===== SONIDO ===== */
let ac;function snd(f,d=.12,t='square'){if(S.mute)return;try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.value=f;g.gain.value=.05;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}
/* ===== DATOS ===== */
const CH=[{n:'Pimpo',c:'#e8453c'},{n:'Luma',c:'#3b82f6'},{n:'Brisa',c:'#22b573'},{n:'Kiko',c:'#f59e0b'}],COST=20,ITEMP=6;
const ITEMS=[{n:'Dado rápido',k:'f',d:'Tu próximo dado saca 6–10'},{n:'Ladrón',k:'t',d:'Roba hasta 5 monedas al más rico'},{n:'Bolsa de monedas',k:'b',d:'+8 monedas'}];
let G=null,drawFn=()=>{},upd=null,pressFn=null,clickFn=null,padRes=null,ptr=null;const K={};
/* ===== TABLERO: Jardines Saltarines ===== */
const N=[],ring=[];const add=(gx,gy)=>{N.push({gx,gy,t:'n',next:[]});return N.length-1};
for(let i=0;i<=6;i++)ring.push(add(i,0));for(let i=1;i<=5;i++)ring.push(add(6,i));for(let i=5;i>=0;i--)ring.push(add(i,5));for(let i=4;i>=1;i--)ring.push(add(0,i));
ring.forEach((a,i)=>N[a].next.push(ring[(i+1)%ring.length]));
const sc=[1,2,3,4].map(i=>add(3,i));N[ring[3]].next.push(sc[0]);for(let i=0;i<3;i++)N[sc[i]].next=[sc[i+1]];N[sc[3]].next=[ring[14]];
const TT=['b','r','e','n','b','s','n'];N.forEach((n,i)=>n.t=TT[(i*3)%7]);N[ring[0]].t='n';sc.forEach((a,i)=>N[a].t=['e','r','b','e'][i]);
const P2=(gx,gy)=>[400+(gx-gy)*46,110+(gx+gy)*24];
function dist(a){const q=[[a,0]],seen=new Set([a]);while(q.length){const[n,d]=q.shift();if(n==G.star)return d;N[n].next.forEach(m=>{if(!seen.has(m)){seen.add(m);q.push([m,d+1])}})}return 99}
/* ===== JUGADORES / ECONOMÍA ===== */
function mk(){const o=[CH[S.ch],...CH.filter((_,i)=>i!=S.ch)];return o.map((c,i)=>({id:i,n:c.n,c:c.c,h:i==0,coins:10,stars:0,node:ring[0],item:null,mg:0,x:0,y:0,j:0}))}
function home(p){const[a,b]=P2(N[p.node].gx,N[p.node].gy);p.x=a+(p.id-1.5)*8;p.y=b-2}
function coin(p,n){const b=p.coins;p.coins=Math.max(0,p.coins+n);const d=p.coins-b;if(G&&G.fx&&d)G.fx.push({x:p.x,y:p.y-34,t:performance.now(),s:(d>0?'+':'')+d+'🪙',c:d>0?'#2a2':'#d22'});if(d)snd(d>0?880:200,.15)}
function L(m){G.log.unshift(m);$('#log').innerHTML=G.log.slice(0,5).map(s=>'• '+s).join('<br>')}
function hud(){$('#hud').innerHTML=G.players.map(p=>`<div class="card ${G.cur==p.id?'cur':''}" style="--c:${p.c}"><b>${p.n}${p.h?' (tú)':''}</b><span>🪙${p.coins} ⭐${p.stars}${p.item?' 🎁':''}</span></div>`).join('')+`<div class="card"><b>Turno ${Math.min(G.turn,G.max)}/${G.max}</b><span><a href="#" onclick="G.dead=1;menu();return false" style="color:inherit">Salir</a></span></div>`}
function ask(msg,opts){return new Promise(r=>{bar.innerHTML=`<div class="msg">${msg}</div><div class="row">`+opts.map((o,i)=>`<button id="a${i}">${o[0]}</button>`).join('')+'</div>';opts.forEach((o,i)=>$('#a'+i).onclick=()=>{bar.innerHTML='';snd(660,.08);r(o[1])})})}
const say=m=>bar.innerHTML=`<div class="msg">${m}</div>`;
function tween(p,tx,ty,ms){return new Promise(r=>{const sx=p.x,sy=p.y,t0=performance.now();(function f(){const k=Math.min(1,(performance.now()-t0)/ms);p.x=sx+(tx-sx)*k;p.y=sy+(ty-sy)*k;p.j=Math.sin(k*Math.PI)*16;if(k<1)requestAnimationFrame(f);else{p.j=0;r()}})()})}
const moveTo=p=>{const[a,b]=P2(N[p.node].gx,N[p.node].gy);return tween(p,a+(p.id-1.5)*8,b-2,260)};
function moveStar(){let n;do n=ring[1+rnd(ring.length-1)];while(n==G.star);G.star=n}
/* ===== TURNOS ===== */
async function useItem(p){const it=p.item;p.item=null;L(`${p.n} usa ${it.n}`);let f=0;if(it.k=='f')f=1;else if(it.k=='b')coin(p,8);else{const o=G.players.filter(q=>q!=p).sort((a,b)=>b.coins-a.coins)[0],t=Math.min(5,o.coins);coin(o,-t);coin(p,t);L(`${p.n} roba ${t} a ${o.n}`)}hud();await sleep(600);return f}
function aiFork(p,nx){const ds=nx.map(dist);const best=ds[0]<=ds[1]?nx[0]:nx[1];return Math.random()<[.4,.75,1][S.diff]?best:nx[rnd(2)]}
async function rollAnim(r){const d=$('#dice');d.style.display='block';snd(300,.05);for(let i=0;i<9;i++){d.textContent=1+rnd(10);snd(250+i*30,.04);await sleep(80)}d.textContent=r;snd(900,.2);await sleep(600);d.style.display='none'}
async function starBuy(p){const y=p.h?await ask(`⭐ ¡Estrella! ¿Comprar por ${COST} monedas?`,[['Comprar',1],['No',0]]):Math.random()<[.7,.95,1][S.diff];if(y&&p.coins>=COST){coin(p,-COST);p.stars++;L(`${p.n} compra una ⭐`);G.fx.push({x:p.x,y:p.y-50,t:performance.now(),s:'⭐',c:'#fb0'});snd(1200,.4,'triangle');moveStar();hud();await sleep(800)}}
async function shop(p){if(p.item){L(`${p.n} ya tiene objeto`);return}const it=ITEMS[rnd(3)];if(p.coins<ITEMP){L(`${p.n} no puede pagar la tienda`);return}
const y=p.h?await ask(`🛒 Tienda: <b>${it.n}</b> (${it.d}) por ${ITEMP} 🪙`,[['Comprar',1],['No',0]]):p.coins>=9&&Math.random()<.7;if(y){coin(p,-ITEMP);p.item=it;L(`${p.n} compra ${it.n}`);hud();await sleep(500)}}
async function event(p){const P=G.players,e=rnd(6);let m;
if(e==0){coin(p,5);m='🎁 Cofre brillante: +5 monedas'}
else if(e==1){const q=P.filter(x=>x!=p)[rnd(3)];[p.node,q.node]=[q.node,p.node];await Promise.all([moveTo(p),moveTo(q)]);m=`🔀 Intercambio de posiciones con ${q.n}`}
else if(e==2){P.forEach(q=>coin(q,2));m='🌧️ Lluvia de monedas: todos +2'}
else if(e==3){const q=[...P].sort((a,b)=>a.coins+a.stars*20-b.coins-b.stars*20)[0];coin(q,6);m=`🤝 Ayuda al más retrasado: ${q.n} +6`}
else if(e==4){coin(p,-4);m='👻 Fantasma travieso: -4 monedas'}
else{moveStar();m='🌟 ¡La estrella se ha movido de sitio!'}
L(`${p.n}: ${m}`);say(m);hud();await sleep(1300)}
async function land(p){const t=N[p.node].t;if(t=='b'){coin(p,3)}else if(t=='r'){coin(p,-3)}else if(t=='e')await event(p);else if(t=='s')await shop(p);hud()}
async function turn(p){G.cur=p.id;hud();let fast=0;
if(p.h){const o=[['🎲 Lanzar dado',0]];if(p.item)o.unshift([`Usar ${p.item.n}`,1]);const c=await ask(`Turno de <b>${p.n}</b>`+(p.item?`<br><small>${p.item.n}: ${p.item.d}</small>`:''),o);if(c==1){fast=await useItem(p);await ask('Ahora, lanza el dado',[['🎲 Lanzar',0]])}}
else{say(`Turno de ${p.n}…`);await sleep(600);if(p.item&&Math.random()<.6)fast=await useItem(p)}
const r=fast?6+rnd(5):1+rnd(10);await rollAnim(r);L(`${p.n} saca ${r}`);
for(let k=r;k>0;k--){const nx=N[p.node].next;let to=nx[0];
 if(nx.length>1){G.hl=nx;to=p.h?await ask(`¡Bifurcación! Quedan ${k} pasos`,[['⬇ Atajo (arriesgado)',nx[1]],['➡ Camino largo',nx[0]]]):aiFork(p,nx);G.hl=[]}
 p.node=to;await moveTo(p);snd(300+k*20,.06);say(`${p.n} avanza… ${k-1}`);
 if(to==G.star&&p.coins>=COST)await starBuy(p)}
await land(p);await sleep(300)}
/* ===== MINIJUEGOS ===== */
const blobs=(x,y,c,j,m)=>blob(x,y,c,j,m);
function blob(x,y,col,j=0,mood=0){X.fillStyle='rgba(0,0,0,.25)';X.beginPath();X.ellipse(x,y+3,12-j/4,5,0,0,7);X.fill();y-=j;X.fillStyle=col;X.beginPath();X.ellipse(x,y-13,12,14,0,0,7);X.fill();X.fillStyle='rgba(255,255,255,.35)';X.beginPath();X.ellipse(x-4,y-19,4,6,0,0,7);X.fill();X.fillStyle='#fff';[-4,4].forEach(d=>{X.beginPath();X.arc(x+d,y-15,3.2,0,7);X.fill()});X.fillStyle='#111';[-4,4].forEach(d=>{X.beginPath();X.arc(x+d,y-14.5,1.5,0,7);X.fill()});X.strokeStyle='#111';X.lineWidth=1.5;X.beginPath();mood<0?X.arc(x,y-4,3,Math.PI*1.1,Math.PI*1.9):X.arc(x,y-8,3.5,.15*Math.PI,.85*Math.PI);X.stroke()}
const txt=(s,x,y,sz=22,c='#fff',al='center')=>{X.font=`900 ${sz}px Trebuchet MS,Verdana`;X.textAlign=al;X.lineWidth=4;X.strokeStyle='#0008';X.strokeText(s,x,y);X.fillStyle=c;X.fillText(s,x,y)};
async function mGems(){const P=G.players,ps=P.map((p,i)=>({x:200+i*130,y:380,s:0,tx:400,ty:250,lag:0})),gems=[];let t=15;
const dim=[.7,.85,1][S.diff];
drawFn=()=>{X.fillStyle='#4fb85a';X.fillRect(0,0,800,480);X.fillStyle='#5ccb67';for(let i=0;i<8;i++)X.fillRect(0,i*120%480,800,60);const T=performance.now()/300;gems.forEach(g=>{const b=Math.sin(T+g.x)*3;X.fillStyle='#0003';X.beginPath();X.ellipse(g.x,g.y+10,10,4,0,0,7);X.fill();X.fillStyle='#38e1ff';X.beginPath();X.moveTo(g.x,g.y-12+b);X.lineTo(g.x+9,g.y+b);X.lineTo(g.x,g.y+10+b);X.lineTo(g.x-9,g.y+b);X.fill();X.fillStyle='#fff8';X.fillRect(g.x-2,g.y-7+b,3,6)});[...ps.keys()].sort((a,b)=>ps[a].y-ps[b].y).forEach(i=>blob(ps[i].x,ps[i].y,P[i].c,0));txt('⏱ '+Math.ceil(t),400,36,28);P.forEach((p,i)=>txt(`${p.n} 💎${ps[i].s}`,100+i*200,470,16,p.c))};
return new Promise(res=>{upd=dt=>{t-=dt;while(gems.length<6)gems.push({x:50+rnd(700),y:80+rnd(340)});
ps.forEach((q,i)=>{const p=P[i];let dx=0,dy=0;
if(p.h){dx=!!(K.d||K.arrowright)-!!(K.a||K.arrowleft);dy=!!(K.s||K.arrowdown)-!!(K.w||K.arrowup);if(!dx&&!dy&&ptr){dx=ptr.x-q.x;dy=ptr.y-q.y;const n=Math.hypot(dx,dy);if(n<8)dx=dy=0;else{dx/=n;dy/=n}}}
else{q.lag-=dt;if(q.lag<=0){q.lag=[.55,.3,.12][S.diff]+Math.random()*.25;let g=gems[rnd(gems.length)];if(S.diff>0)g=gems.reduce((a,b)=>Math.hypot(a.x-q.x,a.y-q.y)<Math.hypot(b.x-q.x,b.y-q.y)?a:b);q.tx=g.x;q.ty=g.y}dx=q.tx-q.x;dy=q.ty-q.y;const n=Math.hypot(dx,dy);if(n<6)dx=dy=0;else{dx/=n;dy/=n}}
const d=Math.hypot(dx,dy)||1;q.x=Math.max(15,Math.min(785,q.x+dx/d*210*(p.h?1:dim)*dt*(d>1?1:Math.min(1,d))));q.y=Math.max(50,Math.min(455,q.y+dy/d*210*(p.h?1:dim)*dt));
for(let k=gems.length-1;k>=0;k--)if(Math.hypot(gems[k].x-q.x,gems[k].y-q.y)<22){gems.splice(k,1);q.s++;if(p.h)snd(1000,.1,'triangle')}});
if(t<=0){upd=null;res(ps.map(q=>q.s))}}})}
let D;
async function mDuel(){const P=G.players,tot=P.map(()=>0);let go=0,early=0,hT=null,t0=0;D={msg:'',col:'#fff',show:0,last:P.map(()=>0)};
drawFn=()=>{X.fillStyle='#2a2f55';X.fillRect(0,0,800,480);X.fillStyle=D.col=='#6f6'?'#1e7a3a':'#3a3f70';X.fillRect(40,60,720,170);txt(D.msg,400,160,38,D.col);P.forEach((p,i)=>{blob(130+i*180,380,p.c,0,D.show&&D.last[i]>=900?-1:0);txt(p.n,130+i*180,415,16,p.c);if(D.show)txt(D.last[i]+' ms',130+i*180,440,18);txt('Total '+(tot[i]/1000).toFixed(2)+'s',130+i*180,462,13)})};
pressFn=clickFn=()=>{if(!go)early=1;else if(hT==null)hT=performance.now()-t0};
for(let r=0;r<3;r++){go=0;early=0;hT=null;D.msg=`Ronda ${r+1}/3: espera…`;D.col='#fff';D.show=0;const w=1200+rnd(2000),s=performance.now();
while(performance.now()-s<w&&!early)await sleep(30);let h;
if(early){D.msg='¡Demasiado pronto! (+0,9 s)';D.col='#f66';h=900}
else{go=1;t0=performance.now();D.msg='¡YA!';D.col='#6f6';snd(880,.2);while(hT==null&&performance.now()-t0<1500)await sleep(10);h=hT==null?1500:Math.round(hT)}
go=0;P.forEach((p,i)=>{const v=p.h?h:[430,320,230][S.diff]+rnd(200);D.last[i]=v;tot[i]+=v});D.show=1;await sleep(1400)}
pressFn=clickFn=null;return tot.map(v=>-v)}
async function mMem(){const P=G.players,seq=[];const pads=[[210,70,'#ff5a5a',262],[430,70,'#4aa3ff',330],[210,250,'#4ccf6a',392],[430,250,'#ffd23b',523]];let lit=-1,msg='',s=0;
drawFn=()=>{X.fillStyle='#2a2f55';X.fillRect(0,0,800,480);pads.forEach((p,i)=>{X.fillStyle='#0006';X.fillRect(p[0],p[1]+14,160,150);X.fillStyle=p[2];X.globalAlpha=lit==i?1:.45;X.fillRect(p[0],p[1]+(lit==i?8:0),160,150);X.globalAlpha=1;txt(i+1,p[0]+80,p[1]+95,34)});txt(msg,400,40,24);txt('Rondas superadas: '+s,400,462,18)};
clickFn=(x,y)=>pads.forEach((p,i)=>{if(x>p[0]&&x<p[0]+160&&y>p[1]&&y<p[1]+150)hit(i)});
const flash=async(i,d=380)=>{lit=i;snd(pads[i][3],d/1000,'sine');await sleep(d);lit=-1;await sleep(130)};
padRes=null;window.hit=i=>{if(padRes){const r=padRes;padRes=null;r(i);flash(i,150)}};
for(let L=1;L<=8;L++){seq.push(rnd(4));msg='Mira la secuencia…';await sleep(600);for(const q of seq)await flash(q,Math.max(220,400-L*20));msg=`¡Repite! (${L})`;let ok=1;
 for(let k=0;k<L&&ok;k++){const v=await Promise.race([new Promise(r=>padRes=r),sleep(5000).then(()=>-1)]);if(v!=seq[k])ok=0}
 padRes=null;if(!ok){msg='¡Fallaste!';snd(150,.4,'sawtooth');await sleep(900);break}s=L;msg='¡Bien!';await sleep(400)}
clickFn=null;const q=[.88,.94,.98][S.diff];return P.map(p=>{if(p.h)return s;let a=0;for(let L=1;L<=8;L++){if(Math.random()<Math.pow(q,L))a=L;else break}return a})}
const MGS=[{n:'💎 Cazagemas',i:'Recoge más gemas en 15 s. Mueve con WASD/flechas o mantén pulsado/arrastra en pantalla.',f:mGems,u:s=>'💎'+s},
{n:'⚡ Duelo de reflejos',i:'3 rondas. Pulsa Espacio, Enter o toca la pantalla en cuanto aparezca ¡YA! Si te adelantas, pierdes 0,9 s.',f:mDuel,u:s=>(-s/1000).toFixed(2)+' s'},
{n:'🔆 Memoria luminosa',i:'Repite la secuencia de luces. Pulsa los paneles (o las teclas 1-4). Gana quien aguante más rondas.',f:mMem,u:s=>s+' rondas'}];
async function playMG(){let m;do m=rnd(MGS.length);while(m==G.lastMg);G.lastMg=m;const g=MGS[m];G.cur=-1;hud();
await ask(`<b>${g.n}</b><br>${g.i}`,[['¡Jugar!',1]]);G.hl=[];const s=await g.f();upd=null;drawFn=drawBoard;
const pay=[10,6,3,0],lines=G.players.map((p,i)=>{const rk=s.filter(v=>v>s[i]).length,gain=pay[rk];coin(p,gain);if(rk==0)p.mg++;return `${p.n}: ${g.u(s[i])} → +${gain}🪙`});
lines.forEach(l=>L(l));hud();await ask('<b>Resultados</b><br>'+lines.join('<br>'),[['Continuar',1]])}
/* ===== RENDER TABLERO ===== */
const poly=(pts,col)=>{X.fillStyle=col;X.beginPath();pts.forEach((q,i)=>i?X.lineTo(q[0],q[1]):X.moveTo(q[0],q[1]));X.closePath();X.fill()};
const starp=(x,y,r)=>{X.fillStyle='#ffd23b';X.strokeStyle='#b8860b';X.lineWidth=2;X.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,rr=i%2?r*.45:r;X.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}X.closePath();X.fill();X.stroke()};
function drawBoard(){const T=performance.now()/500,g=X.createLinearGradient(0,0,0,480);g.addColorStop(0,'#7fd3ff');g.addColorStop(1,'#e2f6ff');X.fillStyle=g;X.fillRect(0,0,800,480);
const a=P2(-1.2,-1.2),b=P2(7.2,-1.2),c=P2(7.2,6.2),d=P2(-1.2,6.2),sh=(p,h)=>[p[0],p[1]+h];
poly([d,c,sh(c,26),sh(d,26)],'#7a4a24');poly([c,b,sh(b,26),sh(c,26)],'#5e3818');poly([a,b,c,d],'#6fcf5a');
[[1.5,2.5],[4.6,3.2],[-.6,2.6],[6.7,2.2]].forEach(([u,v])=>{const[x,y]=P2(u,v);X.fillStyle='#f3e6c8';X.fillRect(x-4,y-14,8,16);X.fillStyle='#e8453c';X.beginPath();X.ellipse(x,y-16,17,11,0,0,7);X.fill();X.fillStyle='#fff';[-7,0,7].forEach(o=>{X.beginPath();X.arc(x+o,y-18+Math.abs(o)/3,2.5,0,7);X.fill()})});
const col={n:'#f6e7c1',b:'#4aa3ff',r:'#ff5a5a',e:'#b57bff',s:'#ffb13b'};
[...N.keys()].sort((p,q)=>N[p].gx+N[p].gy-N[q].gx-N[q].gy).forEach(i=>{const n=N[i],[x,y]=P2(n.gx,n.gy);poly([[x-36,y],[x,y+18],[x,y+28],[x-36,y+10]],'#0004');poly([[x,y+18],[x+36,y],[x+36,y+10],[x,y+28]],'#0006');poly([[x,y-18],[x+36,y],[x,y+18],[x-36,y]],col[n.t]);
const s={b:'+3',r:'-3',e:'?',s:'🛒'}[n.t];if(s)txt(s,x,y+6,15,'#fff');if(i==ring[0])txt('INICIO',x,y+5,11,'#333')});
G.hl.forEach(i=>{const[x,y]=P2(N[i].gx,N[i].gy);X.strokeStyle='#fff';X.lineWidth=4;X.beginPath();X.ellipse(x,y,38+Math.sin(T*3)*4,20,0,0,7);X.stroke()});
{const[x,y]=P2(N[G.star].gx,N[G.star].gy);starp(x,y-26+Math.sin(T*2)*4,15)}
[...G.players].sort((p,q)=>p.y-q.y).forEach(p=>blob(p.x,p.y,p.c,p.j+(G.cur==p.id?Math.abs(Math.sin(T*2))*4:0)));
const now=performance.now();G.fx=G.fx.filter(f=>now-f.t<1400);G.fx.forEach(f=>{const k=(now-f.t)/1400;X.globalAlpha=1-k;txt(f.s,f.x,f.y-k*30,20,f.c);X.globalAlpha=1})}
function drawMenu(){const T=performance.now()/400,g=X.createLinearGradient(0,0,0,480);g.addColorStop(0,'#5fb8ff');g.addColorStop(1,'#bff0c8');X.fillStyle=g;X.fillRect(0,0,800,480);X.fillStyle='#6fcf5a';X.fillRect(0,400,800,80);CH.forEach((c,i)=>blob(180+i*150,440,c.c,Math.abs(Math.sin(T+i))*30))}
function drawPodium(rk){const T=performance.now()/300;X.fillStyle='#2a2f55';X.fillRect(0,0,800,480);rk.forEach((p,i)=>{const x=140+i*170,h=[120,90,60,30][i];X.fillStyle=p.c;X.fillRect(x-45,440-h,90,h);txt(i+1,x,440-h/2+8,28);blob(x,440-h,p.c,i==0?Math.abs(Math.sin(T))*34:0,i>1?-1:0);txt(p.n,x,462,14)})}
/* ===== FLUJO ===== */
const show=h=>{ov.innerHTML=h;ov.style.display='flex'},hide=()=>ov.style.display='none';
function menu(){upd=null;pressFn=clickFn=null;$('#dice').style.display='none';$('#hud').innerHTML='';bar.innerHTML='';$('#log').innerHTML='';G=null;drawFn=drawMenu;
const tg=(k,v,l)=>`<button class="${S[k]==v?'on':''}" onclick="S.${k}=${v};save();menu()">${l}</button>`;
show(`<h1>🏝️ Party Island</h1><p>Personaje</p><div class="row">${CH.map((c,i)=>`<button class="ch ${S.ch==i?'on':''}" style="--c:${c.c}" onclick="S.ch=${i};save();menu()">${c.n}</button>`).join('')}</div><p>Turnos</p><div class="row">${[10,15,20].map(v=>tg('turns',v,v)).join('')}</div><p>Dificultad IA</p><div class="row">${tg('diff',0,'Fácil')}${tg('diff',1,'Normal')}${tg('diff',2,'Difícil')}</div><div class="row"><button class="big" onclick="start()">▶ Jugar</button><button onclick="mgMenu()">Minijuegos</button><button onclick="rec()">Récords</button><button onclick="how()">Cómo jugar</button><button onclick="S.mute^=1;save();menu()">${S.mute?'🔇':'🔊'}</button><button onclick="tests()">Pruebas</button></div>`)}
const back='<div class="row"><button onclick="menu()">Volver</button></div>';
function how(){show(`<h2>Cómo jugar</h2><p>Lanza el dado (1–10) y avanza por el tablero. Azul +3🪙, rojo −3🪙, ? evento, 🛒 tienda. Pasa por la ⭐ con ${COST} monedas para comprarla. En las bifurcaciones eliges ruta. Tras cada ronda hay un minijuego que reparte 10/6/3/0 monedas. Gana quien tenga más ⭐ y, en empate, más monedas. Bonus final: +1⭐ al que más monedas tenga y +1⭐ al mejor en minijuegos.</p>${back}`)}
function rec(){const w=Object.entries(S.wins).map(([k,v])=>`<li>${k}: ${v} victorias</li>`).join('')||'<li>Aún no hay victorias</li>';show(`<h2>Récords</h2><p>Partidas: ${S.games} · Mejor total de monedas: ${S.best}</p><ol>${w}</ol>${back}`)}
function mgMenu(){show(`<h2>Minijuegos</h2><div class="row">${MGS.map((m,i)=>`<button onclick="practice(${i})">${m.n}</button>`).join('')}</div>${back}`)}
async function practice(i){hide();G={players:mk(),fx:[],hl:[],log:[],turn:1,max:1,cur:-1,star:ring[5]};G.players.forEach(home);try{const g=MGS[i],s=await g.f();upd=null;const lines=G.players.map((p,k)=>`${p.n}: ${g.u(s[k])}`);await ask('<b>Resultados</b><br>'+lines.join('<br>'),[['Volver al menú',1]]);menu()}catch(e){}}
function start(){G={players:mk(),turn:1,max:S.turns,cur:-1,star:0,log:[],fx:[],hl:[],lastMg:-1,dead:0};G.players.forEach(home);moveStar();hide();drawFn=drawBoard;S.games++;save();hud();run(G)}
async function run(g){try{while(g.turn<=g.max){for(const p of g.players)await turn(p);await playMG();g.turn++}await finish()}catch(e){if(e!==0)console.error(e)}}
async function finish(){const P=G.players;G.cur=-1;let bonus=[];
const mx=Math.max(...P.map(p=>p.coins)),cw=P.filter(p=>p.coins==mx);if(cw.length==1){cw[0].stars++;bonus.push(`💰 Más monedas: ${cw[0].n} (+1⭐)`)}
const mm=Math.max(...P.map(p=>p.mg)),mw=P.filter(p=>p.mg==mm);if(mm>0&&mw.length==1){mw[0].stars++;bonus.push(`🎮 Mejor en minijuegos: ${mw[0].n} (+1⭐)`)}
const rk=[...P].sort((a,b)=>b.stars-a.stars||b.coins-a.coins),w=rk[0],h=P.find(p=>p.h);
S.wins[w.n]=(S.wins[w.n]||0)+1;S.best=Math.max(S.best,h.coins);save();hud();bar.innerHTML='';drawFn=()=>drawPodium(rk);snd(784,.3,'triangle');
show(`<h2>🏆 ¡${w.n} gana!</h2><ol>${rk.map(p=>`<li>${p.n}: ⭐${p.stars} · 🪙${p.coins} · minijuegos ganados: ${p.mg}</li>`).join('')}</ol><p>${bonus.join('<br>')||'Sin bonificaciones'}</p><div class="row"><button onclick="start()">Revancha</button><button onclick="menu()">Menú</button></div>`)}
function tests(){const r=[];const gs=G;G={fx:[],players:[],star:ring[5]};
r.push(['Todas las casillas tienen salida',N.every(n=>n.next.length>0)]);r.push(['Una sola bifurcación',N.filter(n=>n.next.length>1).length==1]);
r.push(['Estrella alcanzable desde cualquier casilla',N.every((_,i)=>dist(i)<99)]);
r.push(['Dado siempre 1–10',(()=>{for(let i=0;i<2000;i++){const v=1+rnd(10);if(v<1||v>10)return 0}return 1})()]);
const p={coins:2,x:0,y:0};coin(p,-9);r.push(['Monedas nunca negativas',p.coins==0]);
const ps=mk();r.push(['Cuatro jugadores, uno humano',ps.length==4&&ps.filter(q=>q.h).length==1]);
r.push(['Tras la ronda 1 el turno avanza',(()=>{const t={turn:1};t.turn++;return t.turn==2})()]);
G=gs;show(`<h2>Pruebas</h2><ul style="text-align:left">${r.map(a=>`<li>${a[1]?'✅':'❌'} ${a[0]}</li>`).join('')}</ul>${back}`)}
/* ===== ENTRADA Y BUCLE ===== */
const cp=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*800/r.width,y:(e.clientY-r.top)*480/r.height}};
cv.onpointerdown=e=>{ptr=cp(e);clickFn&&clickFn(ptr.x,ptr.y)};cv.onpointermove=e=>{if(ptr)ptr=cp(e)};window.onpointerup=()=>ptr=null;
addEventListener('keydown',e=>{const k=e.key.toLowerCase();K[k]=1;if(upd||pressFn||clickFn)if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();
if(k==' '||k=='enter')pressFn&&pressFn();if('1234'.includes(k)&&k.length==1&&window.hit)window.hit(+k-1)});
addEventListener('keyup',e=>K[e.key.toLowerCase()]=0);
let last=performance.now();(function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;try{if(upd)upd(dt);drawFn()}catch(e){console.error(e)}requestAnimationFrame(loop)})(last);
menu();
</script></body></html>
