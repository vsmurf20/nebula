<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Party Island</title>
<style>
:root{--bg:#f3efe6;--fg:#1d2433;--pn:#fff;--ac:#ff7a1a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Trebuchet MS',Verdana,sans-serif;-webkit-user-select:none;user-select:none}
#app{max-width:1180px;margin:0 auto;padding:8px}
#stage{position:relative;border-radius:16px;overflow:hidden;border:3px solid var(--fg);box-shadow:0 8px 0 #0003}

#ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(20,26,43,.78);color:#fff;text-align:center;overflow:auto;padding:8px}
.pn{background:linear-gradient(#2c3760,#1b2243);border:3px solid #ffd23b;border-radius:18px;padding:14px 22px;max-width:640px;box-shadow:0 10px 30px #0008}
#ov h1{margin:2px;font-size:40px;color:#ffd23b;text-shadow:0 3px 0 #b45309}#ov h2{margin:4px}#ov p{margin:4px 0;font-size:14px}#ov ol,#ov ul{text-align:left;margin:4px;padding-left:24px}
.sec{font-weight:700;letter-spacing:1px;text-transform:uppercase;font-size:12px!important;opacity:.7;margin-top:10px!important}
.menu{display:flex;flex-direction:column;gap:8px;margin:14px 0}.menu button{font-size:17px;padding:12px}.menu button.big{font-size:22px}
.row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:4px 0}
button{font:inherit;font-weight:700;padding:9px 14px;border-radius:10px;border:2px solid #0004;background:#ffd23b;color:#222;cursor:pointer;min-height:42px;transition:transform .1s;box-shadow:0 3px 0 #0004}
button:hover{transform:translateY(-2px) scale(1.04)}button:active{transform:scale(.95)}
button.on{background:var(--ac);color:#fff;outline:3px solid #fff}
button.ch{background:var(--c);color:#fff}button.big{background:#3ccf6a;font-size:20px;padding:10px 26px}

.card i{font-style:normal;background:var(--c);color:#fff;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:900}
.card div{display:flex;flex-direction:column}
.card.cur{outline:3px solid var(--ac);transform:scale(1.04);box-shadow:0 0 18px var(--c)}
.card.tn{flex-direction:column;align-items:stretch;gap:3px}.card u{display:block;height:8px;background:#8884;border-radius:4px;overflow:hidden}.card s{display:block;height:100%;background:var(--ac)}
#bar{background:var(--pn);border-radius:12px;padding:10px;min-height:70px;text-align:center}
.msg{margin-bottom:6px;font-size:16px}#log{font-size:12px;opacity:.8;margin-top:6px;min-height:70px}
#dice{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);width:120px;height:120px;background:#fff;color:#c22;border:6px solid #222;border-radius:24px;font:900 68px/108px Verdana;text-align:center;display:none;box-shadow:0 12px 0 #0005}
#hud{display:block}.pl{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.card{background:linear-gradient(135deg,color-mix(in srgb,var(--c) 24%,var(--pn)),var(--pn));border:2px solid color-mix(in srgb,var(--c) 55%,transparent);border-left-width:8px;border-radius:16px;padding:9px 12px;gap:10px;box-shadow:0 4px 0 #0003}
.card i{position:relative;width:44px;height:44px;font-size:21px;background:radial-gradient(circle at 30% 25%,#fffa,var(--c) 55%);box-shadow:0 3px 0 #0004,inset 0 -5px 0 #0003}
.card i em{position:absolute;top:-16px;left:9px;font-style:normal;font-size:19px}
.nm{flex:1;line-height:1.2}.nm b{font-size:16px}.nm small{opacity:.7}
.ch2{display:flex;flex-direction:column;gap:3px;align-items:flex-end}.ch2 span{background:#0002;border-radius:99px;padding:1px 10px;font-weight:800;font-size:13px}
.card.cur{animation:pl .8s infinite alternate}@keyframes pl{to{box-shadow:0 0 24px var(--c),0 4px 0 #0003;transform:scale(1.05)}}
.top{display:flex;align-items:center;gap:14px;background:var(--pn);border-radius:16px;padding:9px 16px;margin-bottom:10px;box-shadow:0 4px 0 #0003}
.tt{display:flex;flex-direction:column;line-height:1.15}.tt b{font-size:17px}.tt span{font-size:12px;opacity:.7}
.pg{flex:1;height:14px;background:#8884;border-radius:9px;overflow:hidden}.pg s{display:block;height:100%;background:linear-gradient(90deg,#ffd23b,var(--ac));border-radius:9px;transition:width .5s}
.goal{font-weight:800}.top a{color:inherit;font-size:13px;opacity:.7}
#bar{border:2px solid #0002;border-radius:16px;box-shadow:0 4px 0 #0003}
button{background:linear-gradient(#ffe36b,#ffc21a)}button.big{background:linear-gradient(#5ee08a,#2fb85a)}.pv{display:block;width:100%;max-width:440px;margin:8px auto;border-radius:14px;border:3px solid #ffd23b;box-shadow:0 6px 0 #0005}
</style></head><body><div id="app">
<div id="stage"><canvas id="cv" width="960" height="560"></canvas><div id="dice"></div><div id="ov"></div></div>
<div id="hud"></div><div id="bar"></div><div id="log"></div></div>
<script>
const $=s=>document.querySelector(s),cv=$('#cv'),X=cv.getContext('2d'),bar=$('#bar'),ov=$('#ov'),W=960,H=560;
const rnd=n=>Math.floor(Math.random()*n),px=(i,n)=>W*(i+1)/(n+1);
const sleep=async ms=>{await new Promise(r=>setTimeout(r,ms));if(G&&G.dead)throw 0};
/* ===== GUARDADO ===== */
const S=Object.assign({wins:{},games:0,mute:0,turns:10,diff:1,ch:0,best:0,np:4,map:0,hum:1,mode:0},(()=>{try{return JSON.parse(localStorage.getItem('pi2')||'{}')}catch(e){return{}}})());
if(!S.wins||typeof S.wins!='object')S.wins={};
S.turns=[10,15,20].includes(S.turns)?S.turns:10;S.diff=[0,1,2].includes(S.diff)?S.diff:1;S.ch=Math.min(3,Math.max(0,+S.ch||0));S.np=[2,3,4].includes(S.np)?S.np:4;S.map=[0,1,2].includes(S.map)?S.map:0;S.mode=[0,1,2].includes(S.mode)?S.mode:0;S.hum=Math.max(1,Math.min(S.np,+S.hum||1));
const save=()=>{try{localStorage.setItem('pi2',JSON.stringify(S))}catch(e){}};
/* ===== SONIDO ===== */
let ac;function snd(f,d=.12,t='square'){if(S.mute)return;try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.value=f;g.gain.value=.05;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}
/* ===== DATOS ===== */
const CH=[{n:'Pimpo',c:'#e8453c'},{n:'Luma',c:'#3b82f6'},{n:'Brisa',c:'#22b573'},{n:'Kiko',c:'#f59e0b'}],COST=20,ITEMP=6;
const ITEMS=[{n:'Dado rápido',e:'⚡',k:'f',d:'Tu próximo dado saca 6–10'},{n:'Ladrón',e:'🦹',k:'t',d:'Roba hasta 5 monedas al más rico'},{n:'Bolsa de monedas',e:'💰',k:'b',d:'+8 monedas'},{n:'Imán',e:'🧲',k:'m',d:'Atrae 2 monedas de cada rival'}];
let G=null,drawFn=()=>{},upd=null,pressFn=null,clickFn=null,padRes=null,hitFn=null,actFn=null,ptr=null,N,ring,sc,M;const K={};
/* ===== MAPAS ===== */
const MAPS=[{n:'🌳 Jardines',w:6,h:5,mid:3,sky:['#7fd3ff','#e2f6ff'],gr:'#6fcf5a',sd:'#7a4a24',sd2:'#5e3818',dc:'#2f9e44',sea:'#3aa0d8'},
{n:'🌋 Volcán',w:8,h:4,mid:4,sky:['#ff8a4a','#ffe3a8'],gr:'#9a6a4a',sd:'#4a2a1a',sd2:'#331a10',dc:'#ff4a1a',sea:'#c2410c'},
{n:'❄️ Glaciar',w:5,h:6,mid:2,sky:['#9fd0ff','#f4fcff'],gr:'#eaf7ff',sd:'#8ab4d0',sd2:'#6a94b0',dc:'#4aa3ff',sea:'#5fb4e8'}];
const SX=48,SY=25;
const P2=(gx,gy)=>[W/2-(M.w-M.h)/2*SX+(gx-gy)*SX,(H-(M.w+M.h)*SY)/2+14+(gx+gy)*SY];
function build(m){M=MAPS[m];N=[];ring=[];sc=[];const{w,h,mid}=M,add=(gx,gy)=>(N.push({gx,gy,t:'n',next:[]}),N.length-1);
for(let i=0;i<=w;i++)ring.push(add(i,0));for(let i=1;i<=h;i++)ring.push(add(w,i));for(let i=w-1;i>=0;i--)ring.push(add(i,h));for(let i=h-1;i>=1;i--)ring.push(add(0,i));
ring.forEach((a,i)=>N[a].next.push(ring[(i+1)%ring.length]));
for(let i=1;i<h;i++)sc.push(add(mid,i));N[ring[mid]].next.push(sc[0]);sc.forEach((a,i)=>N[a].next=[i<sc.length-1?sc[i+1]:ring[2*w+h-mid]]);
const TT=['b','r','e','n','b','s','n','d'];N.forEach((n,i)=>n.t=TT[(i*3)%8]);N[ring[0]].t='n';sc.forEach((a,i)=>N[a].t='ebrbe'[i%5])}
build(0);
function dist(a){const q=[[a,0]],seen=new Set([a]);while(q.length){const[n,d]=q.shift();if(n==G.star)return d;N[n].next.forEach(m=>{if(!seen.has(m)){seen.add(m);q.push([m,d+1])}})}return 99}
/* ===== JUGADORES / ECONOMÍA ===== */
function mk(){const o=[CH[S.ch],...CH.filter((_,i)=>i!=S.ch)].slice(0,S.np);return o.map((c,i)=>({id:i,n:c.n,c:c.c,h:i<Math.min(S.hum,S.np),coins:10,stars:0,node:ring[0],item:null,mg:0,x:0,y:0,j:0}))}
const off=p=>(p.id-(G.players.length-1)/2)*9;
function home(p){const[a,b]=P2(N[p.node].gx,N[p.node].gy);p.x=a+off(p);p.y=b-2}
function coin(p,n){const b=p.coins;p.coins=Math.max(0,p.coins+n);const d=p.coins-b;if(G&&G.fx&&d)G.fx.push({x:p.x,y:p.y-34,t:performance.now(),s:(d>0?'+':'')+d+'🪙',c:d>0?'#2a2':'#d22'});if(d)snd(d>0?880:200,.15)}
function L(m){G.log.unshift(m);$('#log').innerHTML=G.log.slice(0,5).map(s=>'• '+s).join('<br>')}
function hud(){return hud2();const pr=Math.min(G.turn,G.max)/G.max*100;$('#hud').innerHTML=G.players.map(p=>`<div class="card ${G.cur==p.id?'cur':''}" style="--c:${p.c}"><i>${p.n[0]}</i><div><b>${p.n}${p.h?(S.hum>1?' · J'+(p.id+1):' · tú'):' · 🤖 bot'}${G.teams?' · Eq.'+'AB'[p.id%2]:''}</b><span>🪙${p.coins} ⭐${p.stars} ${p.item?p.item.e:''}</span></div></div>`).join('')+`<div class="card tn"><b>${M.n} · Turno ${Math.min(G.turn,G.max)}/${G.max}${G.coop?` · 🤝 ⭐${G.players.reduce((a,p)=>a+p.stars,0)}/${G.goal}`:G.teams?` · A⭐${ts(0)} B⭐${ts(1)}`:''}</b><u><s style="width:${pr}%"></s></u><a href="#" onclick="G.dead=1;menu();return false" style="color:inherit;font-size:12px">Salir</a></div>`}
function ask(msg,opts){return new Promise(r=>{bar.innerHTML=`<div class="msg">${msg}</div><div class="row">`+opts.map((o,i)=>`<button id="a${i}">${o[0]}</button>`).join('')+'</div>';opts.forEach((o,i)=>$('#a'+i).onclick=()=>{bar.innerHTML='';snd(660,.08);r(o[1])})})}
const say=m=>bar.innerHTML=`<div class="msg">${m}</div>`;
function tween(p,tx,ty,ms){return new Promise(r=>{const sx=p.x,sy=p.y,t0=performance.now();(function f(){const k=Math.min(1,(performance.now()-t0)/ms);p.x=sx+(tx-sx)*k;p.y=sy+(ty-sy)*k;p.j=Math.sin(k*Math.PI)*18;if(k<1)requestAnimationFrame(f);else{p.j=0;r()}})()})}
const moveTo=p=>{const[a,b]=P2(N[p.node].gx,N[p.node].gy);return tween(p,a+off(p),b-2,260)};
function moveStar(){let n;do n=ring[1+rnd(ring.length-1)];while(n==G.star);G.star=n}
/* ===== TURNOS ===== */
async function useItem(p){const it=p.item;p.item=null;L(`${p.n} usa ${it.n}`);let f=0;if(it.k=='f')f=1;else if(it.k=='b')coin(p,8);else if(it.k=='m'){let s=0;G.players.forEach(q=>{if(!mates(p).includes(q)){const t=Math.min(2,q.coins);coin(q,-t);s+=t}});coin(p,s)}else{const o=G.players.filter(q=>!mates(p).includes(q)).sort((a,b)=>b.coins-a.coins)[0],t=Math.min(5,o.coins);coin(o,-t);coin(p,t);L(`${p.n} roba ${t} a ${o.n}`)}hud();await sleep(600);return f}
function aiFork(p,nx){const ds=nx.map(dist);const best=ds[0]<=ds[1]?nx[0]:nx[1];return Math.random()<[.4,.75,1][S.diff]?best:nx[rnd(2)]}
async function rollAnim(r){const d=$('#dice');d.style.display='block';snd(300,.05);for(let i=0;i<9;i++){d.textContent=1+rnd(10);d.style.transform=`translate(-50%,-50%) rotate(${rnd(40)-20}deg)`;snd(250+i*30,.04);await sleep(80)}d.style.transform='translate(-50%,-50%)';d.textContent=r;snd(900,.2);await sleep(600);d.style.display='none'}
const mates=p=>G.coop?G.players:G.teams?G.players.filter(q=>q.id%2==p.id%2):[p],pool=p=>mates(p).reduce((a,q)=>a+q.coins,0),ts=t=>G.players.filter(q=>q.id%2==t).reduce((a,q)=>a+q.stars,0);function pay(p,n){const t=Math.min(n,p.coins);coin(p,-t);let r=n-t;mates(p).filter(q=>q!=p).sort((a,b)=>b.coins-a.coins).forEach(q=>{const u=Math.min(r,q.coins);if(u){coin(q,-u);r-=u}})}
async function starBuy(p){const y=p.h?await ask(`⭐ ¡Estrella! ¿Comprar por ${COST} monedas?`,[['Comprar',1],['No',0]]):Math.random()<[.7,.95,1][S.diff];if(y&&pool(p)>=COST){pay(p,COST);p.stars++;L(`${p.n} compra una ⭐`);G.fx.push({x:p.x,y:p.y-50,t:performance.now(),s:'⭐',c:'#fb0'});snd(1200,.4,'triangle');moveStar();hud();await sleep(800)}}
async function shop(p){if(p.item){L(`${p.n} ya tiene objeto`);return}const IT=ITEMS.filter(i=>!(G.coop&&'tm'.includes(i.k))),it=IT[rnd(IT.length)];if(p.coins<ITEMP){L(`${p.n} no puede pagar la tienda`);return}
const y=p.h?await ask(`🛒 Tienda: <b>${it.e} ${it.n}</b> (${it.d}) por ${ITEMP} 🪙`,[['Comprar',1],['No',0]]):p.coins>=9&&Math.random()<.7;if(y){coin(p,-ITEMP);p.item=it;L(`${p.n} compra ${it.n}`);hud();await sleep(500)}}
async function event(p){const P=G.players,e=rnd(6);let m;
if(e==0){coin(p,5);m='🎁 Cofre brillante: +5 monedas'}
else if(e==1){const q=P.filter(x=>x!=p)[rnd(P.length-1)];[p.node,q.node]=[q.node,p.node];await Promise.all([moveTo(p),moveTo(q)]);m=`🔀 Intercambio de posiciones con ${q.n}`}
else if(e==2){P.forEach(q=>coin(q,2));m='🌧️ Lluvia de monedas: todos +2'}
else if(e==3){const q=[...P].sort((a,b)=>a.coins+a.stars*20-b.coins-b.stars*20)[0];coin(q,6);m=`🤝 Ayuda al más retrasado: ${q.n} +6`}
else if(e==4){coin(p,-4);m='👻 Fantasma travieso: -4 monedas'}
else{moveStar();m='🌟 ¡La estrella se ha movido de sitio!'}
L(`${p.n}: ${m}`);say(m);hud();await sleep(1300)}
async function duelTile(p){if(G.coop){G.players.forEach(q=>coin(q,2));L('🤝 Cofre del equipo: todos +2');say('🤝 Cofre del equipo: todos +2');hud();await sleep(1200);return}const R=G.players.filter(x=>!mates(p).includes(x)),q=R[rnd(R.length)],w=Math.random()<.5,a=w?p:q,b=w?q:p,m=Math.min(4,b.coins);coin(b,-m);coin(a,m);const s=`⚔️ Duelo de suerte: ${a.n} gana ${m}🪙 a ${b.n}`;L(s);say(s);hud();await sleep(1300)}
async function land(p){const t=N[p.node].t;if(t=='b')coin(p,3);else if(t=='r')coin(p,-3);else if(t=='e')await event(p);else if(t=='s')await shop(p);else if(t=='d')await duelTile(p);hud()}
async function turn(p){G.cur=p.id;hud();let fast=0;
if(p.h){const o=[['🎲 Lanzar dado',0]];if(p.item)o.unshift([`Usar ${p.item.e} ${p.item.n}`,1]);const c=await ask(`Turno de <b>${p.n}</b>`+(p.item?`<br><small>${p.item.n}: ${p.item.d}</small>`:''),o);if(c==1){fast=await useItem(p);await ask('Ahora, lanza el dado',[['🎲 Lanzar',0]])}}
else{say(`Turno de ${p.n}…`);await sleep(600);if(p.item&&Math.random()<.6)fast=await useItem(p)}
const r=fast?6+rnd(5):1+rnd(10);await rollAnim(r);L(`${p.n} saca ${r}`);
for(let k=r;k>0;k--){const nx=N[p.node].next;let to=nx[0];
 if(nx.length>1){G.hl=nx;to=p.h?await ask(`¡Bifurcación! Quedan ${k} pasos`,[['⬇ Atajo (arriesgado)',nx[1]],['➡ Camino largo',nx[0]]]):aiFork(p,nx);G.hl=[]}
 p.node=to;await moveTo(p);snd(300+k*20,.06);say(`${p.n} avanza… ${k-1}`);
 if(to==G.star&&pool(p)>=COST)await starBuy(p)}
await land(p);await sleep(300)}

async function torneo(){lobOn=0;S.np=4;S.hum=lobN;save();hide();build(S.map);G={players:mk(),fx:[],hl:[],log:[],turn:1,max:5,cur:-1,star:ring[5],lastMg:-1,dead:0,trn:1};G.players.forEach(home);drawFn=drawScore;hud();
try{for(;G.turn<=5;G.turn++)await playMG();const rk=[...G.players].sort((a,b)=>b.coins-a.coins||b.mg-a.mg);bar.innerHTML='';drawFn=()=>drawPodium(rk);hud();show(`<div class="pn"><h2>🏆 ¡${rk[0].n} gana el torneo!</h2><ol>${rk.map(p=>`<li>${p.n}${p.h?' (J'+(p.id+1)+')':' 🤖'}: 🪙${p.coins} · minijuegos ganados: ${p.mg}</li>`).join('')}</ol><div class="row"><button onclick="torneo()">Otra vez</button><button onclick="menu()">Menú</button></div></div>`)}catch(e){if(e!==0)console.error(e)}}
/* ===== FLUJO ===== */
const show=h=>{ov.innerHTML=h;ov.style.display='flex'},hide=()=>ov.style.display='none';
function menu(){S.hum=Math.min(S.hum,S.np);lobOn=0;upd=null;pressFn=clickFn=hitFn=actFn=null;$('#dice').style.display='none';$('#hud').innerHTML='';bar.innerHTML='';$('#log').innerHTML='';G=null;drawFn=drawMenu;
const tg=(k,v,l)=>`<button class="${S[k]==v?'on':''}" onclick="S.${k}=${v};save();menu()">${l}</button>`;
return home2();show(`<div class="pn"><h1>🏝️ Party Island</h1><p class="sec">Modo</p><div class="row">${tg('mode',0,'⚔️ Individual')}${tg('mode',1,'👥 Equipos')}${tg('mode',2,'🤝 Cooperativo')}</div><p class="sec">Humanos (el resto, bots 🤖)</p><div class="row">${[1,2,3,4].filter(v=>v<=S.np).map(v=>tg('hum',v,v==1?'1 · vs bots':v+' humanos')).join('')}</div><p class="sec">Jugadores totales</p><div class="row">${[2,3,4].map(v=>tg('np',v,v+' jugadores')).join('')}</div><p class="sec">Mapa</p><div class="row">${MAPS.map((m,i)=>tg('map',i,m.n)).join('')}</div><p class="sec">Personaje</p><div class="row">${CH.map((c,i)=>`<button class="ch ${S.ch==i?'on':''}" style="--c:${c.c}" onclick="S.ch=${i};save();menu()">${c.n}</button>`).join('')}</div><p class="sec">Turnos</p><div class="row">${[10,15,20].map(v=>tg('turns',v,v)).join('')}</div><p class="sec">Dificultad IA</p><div class="row">${tg('diff',0,'Fácil')}${tg('diff',1,'Normal')}${tg('diff',2,'Difícil')}</div><div class="row" style="margin-top:12px"><button class="big" onclick="start()">▶ Jugar</button></div><div class="row"><button onclick="lobby()">⚡ Torneo rápido</button><button onclick="mgMenu()">Minijuegos</button><button onclick="rec()">Récords</button><button onclick="how()">Cómo jugar</button><button onclick="S.mute^=1;save();menu()">${S.mute?'🔇':'🔊'}</button><button onclick="tests()">Pruebas</button></div></div>`)}
const back='<div class="row"><button onclick="menu()">Volver</button></div>';
let tab=0;
const TABS=['🎯 Modo','👥 Jugadores','🗺️ Mapa','🎚️ Ajustes'];
const tg2=(k,v,l)=>`<button class="${S[k]==v?'on':''}" onclick="S.${k}=${v};save();cfg()">${l}</button>`;
function home2(){const nb=S.np-S.hum;show(`<div class="pn"><h1>🏝️ Party Island</h1><p>${['⚔️ Individual','👥 Equipos','🤝 Cooperativo'][S.mode]} · ${S.hum} humano${S.hum>1?'s':''} + ${nb} bot${nb==1?'':'s'} · ${MAPS[S.map].n} · ${S.turns} turnos</p><div class="menu"><button class="big" onclick="start()">▶ Jugar</button><button onclick="cfg()">⚙️ Configurar partida</button><button onclick="lobby()">⚡ Torneo rápido</button><button onclick="mgMenu()">🎮 Minijuegos</button></div><div class="row"><button onclick="rec()">🏆 Récords</button><button onclick="how()">❓ Cómo jugar</button><button onclick="S.mute^=1;save();menu()">${S.mute?'🔇':'🔊'}</button><button onclick="tests()">🧪</button></div></div>`)}
function cfg(){S.hum=Math.min(S.hum,S.np);const t=tg2,pg=[
`<p class="sec">Modo de juego</p><div class="row">${t('mode',0,'⚔️ Individual')}${t('mode',1,'👥 Equipos')}${t('mode',2,'🤝 Cooperativo')}</div><p>${['Cada uno juega por su cuenta.','Equipo A (J1, J3) contra B (J2, J4): comparten monedas y ⭐.','Todos juntos hacia la meta de estrellas.'][S.mode]}</p>`,
`<p class="sec">Jugadores totales</p><div class="row">${[2,3,4].map(v=>t('np',v,v)).join('')}</div><p class="sec">Humanos (el resto, bots 🤖)</p><div class="row">${[1,2,3,4].filter(v=>v<=S.np).map(v=>t('hum',v,v)).join('')}</div><p class="sec">Personaje</p><div class="row">${CH.map((c,i)=>`<button class="ch ${S.ch==i?'on':''}" style="--c:${c.c}" onclick="S.ch=${i};save();cfg()">${c.n}</button>`).join('')}</div><img class="pv" src="${pvImg('ch')}">`,
`<p class="sec">Mapa</p><img class="pv" src="${pvImg('map')}"><div class="row">${MAPS.map((m,i)=>t('map',i,m.n)).join('')}</div><p>${MD[S.map]}</p>`,
`<p class="sec">Turnos</p><div class="row">${[10,15,20].map(v=>t('turns',v,v)).join('')}</div><p class="sec">Dificultad de los bots</p><div class="row">${[['Fácil',0],['Normal',1],['Difícil',2]].map(([l,v])=>t('diff',v,l)).join('')}</div>`];
show(`<div class="pn"><h2>⚙️ Configurar partida</h2><div class="row">${TABS.map((n,i)=>`<button class="${tab==i?'on':''}" onclick="tab=${i};cfg()">${n}</button>`).join('')}</div>${pg[tab]}<div class="row" style="margin-top:12px"><button class="big" onclick="start()">▶ Jugar</button><button onclick="menu()">Volver</button></div></div>`)}
function how(){show(`<div class="pn"><h2>Cómo jugar</h2><p>Lanza el dado (1–10) y avanza. Azul +3🪙, rojo −3🪙, ? evento, 🛒 tienda (4 objetos), ⚔ duelo de suerte contra un rival. Pasa por la ⭐ con ${COST} monedas para comprarla. En la bifurcación eliges atajo o camino largo. Tras cada ronda hay un minijuego (7 distintos) que reparte 10/6/3/0 monedas. Gana quien tenga más ⭐ y, en empate, más monedas. Bonus final: +1⭐ al que más monedas tenga y +1⭐ al mejor en minijuegos.</p><p>⚡ Torneo rápido: 5 minijuegos seguidos en el mismo ordenador; cada jugador se une con su tecla. 👥 Equipos: A (J1, J3) contra B (J2, J4); comparten monedas y estrellas y gana el equipo con más ⭐. 🤝 Cooperativo: todos forman un equipo; comparten las monedas para comprar ⭐ y debe llegar a la meta (3/4/5 ⭐ según turnos) antes de que acabe la partida. Con varios humanos se juega por turnos en el tablero y, en los minijuegos, cada uno usa sus teclas: J1 WASD·Q, J2 flechas·Enter, J3 IJKL·U, J4 FHTG·R.</p>${back}</div>`)}
function rec(){const w=Object.entries(S.wins).map(([k,v])=>`<li>${k}: ${v} victorias</li>`).join('')||'<li>Aún no hay victorias</li>';show(`<div class="pn"><h2>Récords</h2><p>Partidas: ${S.games} · Mejor total de monedas: ${S.best}</p><ol>${w}</ol>${back}</div>`)}
function mgMenu(){show(`<div class="pn"><h2>Minijuegos</h2><div class="row">${MGS.map((m,i)=>`<button onclick="practice(${i})">${m.n}</button>`).join('')}</div>${back}</div>`)}
async function practice(i){hide();build(S.map);G={players:mk(),fx:[],hl:[],log:[],turn:1,max:1,cur:-1,star:ring[5]};G.players.forEach(home);try{const g=MGS[i];G.mg=i;const s=await g.f();G.mg=null;upd=null;pressFn=clickFn=hitFn=actFn=null;const lines=G.players.map((p,k)=>`${p.n}: ${g.u(s[k])}`);await ask('<b>Resultados</b><br>'+lines.join('<br>'),[['Volver al menú',1]]);menu()}catch(e){}}
function start(){build(S.map);G={players:mk(),turn:1,max:S.turns,coop:S.mode==2,teams:S.mode==1,goal:S.turns==10?3:S.turns==15?4:5,cur:-1,star:0,log:[],fx:[],hl:[],lastMg:-1,dead:0};G.players.forEach(home);moveStar();hide();drawFn=drawBoard;S.games++;save();hud();run(G)}
async function run(g){try{while(g.turn<=g.max){for(const p of g.players){await turn(p);if(g.coop&&g.players.reduce((a,q)=>a+q.stars,0)>=g.goal)return await finish()}await playMG();g.turn++}await finish()}catch(e){if(e!==0)console.error(e)}}
async function finish(){const P=G.players;G.cur=-1;let bonus=[];
if(G.teams){const tt=[0,1].map(t=>({t,s:ts(t),c:P.filter(q=>q.id%2==t).reduce((a,q)=>a+q.coins,0)})).sort((a,b)=>b.s-a.s||b.c-a.c),w=tt[0],rk=[...P].sort((a,b)=>(b.id%2==w.t)-(a.id%2==w.t)||b.stars-a.stars||b.coins-a.coins);S.wins['Equipo '+'AB'[w.t]]=(S.wins['Equipo '+'AB'[w.t]]||0)+1;save();hud();bar.innerHTML='';drawFn=()=>drawPodium(rk);snd(784,.3,'triangle');show(`<div class="pn"><h2>🏆 ¡Gana el equipo ${'AB'[w.t]}!</h2><p>${tt.map(x=>`Equipo ${'AB'[x.t]}: ⭐${x.s} · 🪙${x.c}`).join('<br>')}</p><ol>${rk.map(p=>`<li>${p.n} (Eq.${'AB'[p.id%2]}): ⭐${p.stars} · 🪙${p.coins}</li>`).join('')}</ol><div class="row"><button onclick="start()">Revancha</button><button onclick="menu()">Menú</button></div></div>`);return}
if(G.coop){const st=P.reduce((a,p)=>a+p.stars,0),win=st>=G.goal,rk=[...P].sort((a,b)=>b.stars-a.stars||b.coins-a.coins);S.best=Math.max(S.best,P.reduce((a,p)=>a+p.coins,0));if(win)S.wins['Equipo']=(S.wins['Equipo']||0)+1;save();hud();bar.innerHTML='';drawFn=()=>drawPodium(rk);snd(win?784:150,.3,'triangle');show(`<div class="pn"><h2>${win?'🏆 ¡Victoria cooperativa!':'😢 Se acabó el tiempo'}</h2><p>Estrellas del equipo: ⭐${st}/${G.goal}</p><ol>${rk.map(p=>`<li>${p.n}: ⭐${p.stars} · 🪙${p.coins} · minijuegos ganados: ${p.mg}</li>`).join('')}</ol><div class="row"><button onclick="start()">Reintentar</button><button onclick="menu()">Menú</button></div></div>`);return}
const mx=Math.max(...P.map(p=>p.coins)),cw=P.filter(p=>p.coins==mx);if(cw.length==1){cw[0].stars++;bonus.push(`💰 Más monedas: ${cw[0].n} (+1⭐)`)}
const mm=Math.max(...P.map(p=>p.mg)),mw=P.filter(p=>p.mg==mm);if(mm>0&&mw.length==1){mw[0].stars++;bonus.push(`🎮 Mejor en minijuegos: ${mw[0].n} (+1⭐)`)}
const rk=[...P].sort((a,b)=>b.stars-a.stars||b.coins-a.coins),w=rk[0],h=P.find(p=>p.h);
S.wins[w.n]=(S.wins[w.n]||0)+1;S.best=Math.max(S.best,h.coins);save();hud();bar.innerHTML='';drawFn=()=>drawPodium(rk);snd(784,.3,'triangle');
show(`<div class="pn"><h2>🏆 ¡${w.n} gana!</h2><ol>${rk.map(p=>`<li>${p.n}: ⭐${p.stars} · 🪙${p.coins} · minijuegos ganados: ${p.mg}</li>`).join('')}</ol><p>${bonus.join('<br>')||'Sin bonificaciones'}</p><div class="row"><button onclick="start()">Revancha</button><button onclick="menu()">Menú</button></div></div>`)}
function tests(){const r=[],gs=G;G={fx:[],players:[],star:0};
MAPS.forEach((m,i)=>{build(i);G.star=ring[5];r.push([m.n+': casillas con salida y una sola bifurcación',N.every(n=>n.next.length>0)&&N.filter(n=>n.next.length>1).length==1]);r.push([m.n+': estrella alcanzable',N.every((_,k)=>dist(k)<99)])});
r.push(['Dado siempre 1–10',(()=>{for(let i=0;i<2000;i++){const v=1+rnd(10);if(v<1||v>10)return 0}return 1})()]);
const p={coins:2,x:0,y:0};coin(p,-9);r.push(['Monedas nunca negativas',p.coins==0]);
[2,3,4].forEach(v=>{const o=S.np;S.np=v;build(S.map);const ps=mk();r.push([v+' jugadores, uno humano',ps.length==v&&ps.filter(q=>q.h).length==Math.min(S.hum,v)]);S.np=o});
build(S.map);G=gs;show(`<div class="pn"><h2>Pruebas</h2><ul>${r.map(a=>`<li>${a[1]?'✅':'❌'} ${a[0]}</li>`).join('')}</ul>${back}</div>`)}
/* ===== ENTRADA Y BUCLE ===== */
const cp=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}};
cv.onpointerdown=e=>{ptr=cp(e);clickFn&&clickFn(ptr.x,ptr.y)};cv.onpointermove=e=>{if(ptr)ptr=cp(e)};window.onpointerup=()=>ptr=null;
addEventListener('keydown',e=>{const k=e.key.toLowerCase();K[k]=1;if(upd||pressFn||clickFn)if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();
if(lobOn&&lobN<4&&k==KS[lobN][4]){lobN++;lobR()}if(actFn&&S.hum>1)KS.forEach((s,i)=>{if(k==s[4])actFn(i)});if(k==' '||k=='enter'){if(pressFn)pressFn();else if(G&&!upd&&ov.style.display!='flex'){const b=bar.querySelector('button');b&&b.click()}}
if('1234'.includes(k)&&k.length==1&&hitFn)hitFn(+k-1)});
addEventListener('keyup',e=>K[e.key.toLowerCase()]=0);
let last=performance.now();(function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;try{if(upd)upd(dt);drawFn();if(G&&G.mg!=null)mgFx()}catch(e){console.error(e)}requestAnimationFrame(loop)})(last);
menu();
</script></body></html>
